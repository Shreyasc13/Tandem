<style>

.ccard{border-radius:16px;padding:16px;color:#fff;margin-bottom:10px;background:linear-gradient(135deg,#1f2937,#0f766e)}

.ccard .nm{font-weight:720;font-size:16px}.ccard small{opacity:.8}
.ccard .bar{background:rgba(255,255,255,.2);margin:10px 0 4px}.ccard .bar>i{background:#fff}

<script>
(() => {
'use strict';

/* ───────────────────────── helpers ───────────────────────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const toStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return toStr(d); };

const dim = (y, m) => new Date(y, m, 0).getDate();

const dayLabel = s => { const t = today(); if (s === t) return 'Today'; if (s === addDays(t, -1)) return 'Yesterday'; return parseD(s).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }); };

];

const nf = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 });

    const full = wantFull || !meta.since || !state.users.length || Date.now() - (meta.fullAt || 0) > 864e5;
    wantFull = false;

    const fresh = state.expenses.filter(e => !had.has(e.id) && !e.deleted && e.createdBy && e.createdBy !== meId());

/* ───────────────────────── money logic ───────────────────────── */
function computeShares(amount, paidBy, splitType, payerPct) {
  let pct1;
  if (splitType === 'personal') pct1 = paidBy === 'u1' ? 100 : 0;
  else if (splitType === 'other') pct1 = paidBy === 'u1' ? 0 : 100;
  else if (splitType === 'custom') pct1 = paidBy === 'u1' ? payerPct : 100 - payerPct;

/** Positive: partner owes me. Negative: I owe partner. */

const TR_KINDS = [['card_bill', 'Card bill', '💳'], ['own', 'Between my accounts', '🔁'], ['cash', 'Cash withdrawal', '💵']];

/** money in / out of one account over the entries that match `pred` */

  for (const e of live()) {
    if (!pred(e)) continue;
    if (e.type === 'income') { if (e.accountId === a.id) i += e.amount; }
    else if (e.type === 'transfer') { if (e.accountId === a.id) o += e.amount; if (e.toAccountId === a.id) i += e.amount; }
    else if (e.type === 'expense' && e.accountId === a.id) { if (e.amount < 0) i -= e.amount; else o += e.amount; }

}

  for (const e of list) {

      ${delta == null ? '' : `<p class="hint"><b class="${delta > 0 ? 'neg' : 'pos'}">${delta > 0 ? '▲' : '▼'} ${Math.abs(delta).toFixed(0)}% ${delta > 0 ? 'more' : 'less'}</b> than ${isCur ? 'the same point in ' : ''}${esc(monthName(pm))} (${money0(pTo)})</p>`}</div>
    <div class="grid2">
      <div class="card"><h3>By category</h3><div class="donutwrap"><div class="donut"><svg viewBox="0 0 120 120" role="img" aria-label="Spend by category">${segs}</svg><div class="mid"><span><b>${moneyShort(st.sum)}</b>total</span></div></div>
        <div class="legend">${top.map(t => `<div class="lg"><i style="background:${t.color}"></i><span>${esc(t.label)}</span><b>${money0(t.v)}</b><em>${(t.v / st.sum * 100).toFixed(0)}%</em></div>`).join('')}</div></div></div>
      <div class="card"><h3>Day by day</h3><div class="bars">${bars}</div><div class="axis"><span>1</span><span>${Math.round(days / 2)}</span><span>${days}</span></div>
        <div class="hint">Busiest day: ${(() => { const b = Object.entries(st.byDay).sort((a, c) => c[1] - a[1])[0]; return b ? `${niceDate(b[0])} (${money0(b[1])})` : '—'; })()}</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Last 6 months</h3><div class="trend">${months.map(x => `<div class="${x.k === ym ? 'cur' : ''}"><b>${x.v ? moneyShort(x.v) : ''}</b><i style="height:${(x.v / maxM * 78).toFixed(1)}%"></i>${monthShort(x.k)}</div>`).join('')}</div></div>
      <div class="card"><h3>How you paid</h3>${modes.map(([id, v]) => `<div class="hb"><span>${esc(modeLabel(id))}</span><div class="bar"><i style="width:${(v / modes[0][1] * 100).toFixed(1)}%"></i></div><b>${money0(v)}</b></div>`).join('')}</div>
    </div>
    ${(up => up.length ? `<div class="card"><h3>By UPI app</h3>${up.map(([n, v]) => `<div class="hb"><span>${esc(n)}</span><div class="bar"><i style="width:${(v / up[0][1] * 100).toFixed(1)}%"></i></div><b>${money0(v)}</b></div>`).join('')}</div>` : '')(Object.entries(st.list.reduce((m, e) => { if (e.mode === 'upi' && e.upiApp) m[e.upiApp] = (m[e.upiApp] || 0) + (ui.basis === 'mine' ? shareOf(e, me) : spendOf(e)); return m; }, {})).sort((a, b) => b[1] - a[1]))}
    ${(pl => pl.length ? `<div class="card"><h3>By platform</h3>${pl.map(([n, v]) => `<div class="hb"><span>${esc(n)}</span><div class="bar"><i style="width:${(v / pl[0][1] * 100).toFixed(1)}%"></i></div><b>${money0(v)}</b></div>`).join('')}</div>` : '')(Object.entries(st.byPlat).sort((a, b) => b[1] - a[1]))}
    <div class="card"><h3>Who paid, who it was for</h3>
      <div class="rowflex between" style="font-size:13px;margin-bottom:6px"><span>${esc(you(me))} paid <b>${money0(st.paidMe)}</b></span><span>${esc(uname(ot))} paid <b>${money0(st.paidOther)}</b></span></div>
      <div class="split2"><i style="width:${(st.paidMe / paidTot * 100).toFixed(1)}%;background:${esc(ucolor(me))}"></i><i style="flex:1;background:${esc(ucolor(ot))}"></i></div>
      <div class="rowflex between" style="font-size:13px;margin:12px 0 6px"><span>Your share <b>${money0(st.mine)}</b></span><span>${esc(uname(ot))}'s share <b>${money0(st.theirs)}</b></span></div>
      <div class="split2"><i style="width:${(st.mine / (st.total || 1) * 100).toFixed(1)}%;background:${esc(ucolor(me))}"></i><i style="flex:1;background:${esc(ucolor(ot))}"></i></div></div>
    ${budCats.length ? `<div class="card"><h3>Budgets (household)</h3>${budCats.map(c => { const sp = stats(ym, 'all').byCat[c.id] || 0, b = Number(bud[c.id]); return `<div style="margin-bottom:12px"><div class="rowflex between" style="font-size:13.5px;margin-bottom:5px"><span>${esc(c.emoji + ' ' + c.name)}</span><span class="${sp > b ? 'neg' : ''}"><b>${money0(sp)}</b> / ${money0(b)}</span></div>${budgetBar(sp, b)}</div>`; }).join('')}</div>` : ''}
    ${(inc => { if (!inc.length) return ''; const by = {}; inc.forEach(e => (by[e.category] = (by[e.category] || 0) + e.amount)); const tot = inc.reduce((s, e) => s + e.amount, 0);
      return `<div class="card"><h3>Money in${ui.basis === 'mine' ? ' (yours)' : ''}</h3>${Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="rowflex between" style="padding:5px 0"><span>${inKind(k)[2]} ${inKind(k)[1]}</span><b>${money0(v)}</b></div>`).join('')}<p class="hint">In ${money0(tot)} · spent ${money0(st.sum)} · <b class="${tot - st.sum >= 0 ? 'pos' : 'neg'}">${money0(Math.abs(tot - st.sum))} ${tot - st.sum >= 0 ? 'left' : 'over'}</b></p></div>`; })(incomes().filter(e => monthOf(e.date) === ym && (ui.basis === 'all' || e.paidBy === me)))}
    <div class="card"><h3>Biggest expenses</h3><div class="list">${big.map(expRow).join('')}</div></div>
    <button class="btn block" data-act="shareSummary">Share this month's summary</button>`}`;
  },

  more() {
    const item = (v, ico, t, s) => `<button class="row" data-act="nav" data-v="${v}"><span class="ico">${ico}</span><span class="rmain"><b>${t}</b><small>${s}</small></span><span class="muted">›</span></button>`;
    const nCards = liveCards().length, nRec = state.recurring.filter(r => !r.deleted && r.active).length;
    return `<div class="card"><div class="list">
      ${item('cards', '💳', 'Credit cards', nCards ? `${nCards} card${nCards > 1 ? 's' : ''} · bill dates and due reminders` : 'Add cards to track bills and due dates')}
      ${(n => item('accounts', '🏦', 'Bank accounts & money in', n ? `${n} account${n > 1 ? 's' : ''} · salary, refunds, transfers` : 'Add accounts with their UPI apps, log salary and refunds'))(liveAccts().length)}
      ${item('recurring', '🔁', 'Recurring expenses', nRec ? `${nRec} active` : 'Rent, subscriptions, EMIs — added automatically')}
      ${item('budgets', '🎯', 'Budgets', S.budgets._total ? `${money0(S.budgets._total)} per month` : 'Set monthly limits')}
      ${item('categories', '🏷️', 'Categories', `${S.activeCats.length} categories`)}
      ${(d => item('friends', '👥', 'Friends', d.length ? `${money(d.reduce((s, x) => s + x.amount, 0))} to collect · ${d.length} item${d.length > 1 ? 's' : ''}` : 'Split bills with friends and track who has paid back'))(friendDues())}
      ${item('settings', '⚙️', 'Settings', 'Profile, default split, reminders')}
    </div></div>
    <div class="card"><div class="list">
      ${meta.sheetUrl && !cfg.demo ? `<a class="row" href="${esc(meta.sheetUrl)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><span class="ico">📗</span><span class="rmain"><b>Open Google Sheet</b><small>Your raw data — edit, filter or pivot it freely</small></span><span class="muted">↗</span></a>` : ''}
      ${cfg.demo ? '' : '<button class="row" data-act="importCsv"><span class="ico">⬆️</span><span class="rmain"><b>Import expenses</b><small>From your old sheet or a statement (CSV)</small></span></button>'}
      <button class="row" data-act="exportCsv"><span class="ico">⬇️</span><span class="rmain"><b>Export CSV</b><small>Download all expenses</small></span></button>
      ${installEvt ? '<button class="row" data-act="install"><span class="ico">📲</span><span class="rmain"><b>Install app</b><small>Add Tandem to this device</small></span></button>' : ''}
    </div></div>
    <p class="hint center">iPhone/iPad: Share → Add to Home Screen · Android/desktop: browser menu → Install app</p>`;
  },

  cards() {
    const cs = liveCards().sort((a, b) => (a.owner === meId() ? -1 : 1) - (b.owner === meId() ? -1 : 1));
    return `${cs.length ? cs.map(c => {
      const i = cardInfo(c);
      const pill = i.billed <= 0 ? '<span class="pill">No bill</span>' : i.paid ? '<span class="pill ok">Paid</span>' : i.daysToDue < 0 ? `<span class="pill bad">Overdue ${-i.daysToDue}d</span>` : `<span class="pill ${i.daysToDue <= S.remind ? 'soon' : ''}">Due in ${i.daysToDue}d</span>`;
      return `<div class="ccard ${c.owner === 'u2' ? 'o2' : ''}">
        <div class="rowflex between"><div><div class="nm">${esc(c.name)}${c.last4 ? ' <small>•• ' + esc(c.last4) + '</small>' : ''}</div><small>${esc(you(c.owner))} · bill on ${c.statementDay}, due on ${c.dueDay}</small></div><button class="btn sm" data-act="editCard" data-id="${esc(c.id)}">Edit</button></div>
        <div style="margin-top:14px"><small>Unbilled · next bill ${niceDate(i.next)}</small><div class="big" style="font-size:26px">${money(i.unbilled)}</div>
        ${c.limit ? `<div class="bar"><i style="width:${Math.min(100, (i.unbilled + (i.paid ? 0 : i.billed)) / c.limit * 100).toFixed(1)}%"></i></div><small>${money0(Math.max(0, c.limit - i.unbilled - (i.paid ? 0 : i.billed)))} available of ${money0(c.limit)}</small>` : ''}</div>
        <div class="st"><div><small>Last bill · ${niceDate(i.stmt)}</small><div><b>${money(i.billed)}</b> ${pill}</div>${i.billed > 0 ? `<small>Pay by ${niceDate(i.due)}</small>` : ''}</div>
        ${i.billed > 0 ? `<button class="btn sm" data-act="${i.paid ? 'unmarkPaid' : 'markPaid'}" data-id="${esc(c.id)}">${i.paid ? 'Undo' : 'Mark paid'}</button>` : ''}</div>
        <div class="rowflex between" style="margin-top:10px"><small>${(rc => rc ? 'Checked against statement ✓ ' + money(rc.total) : 'Not checked against the statement yet')(recons()[c.id + '_' + i.stmt])}</small><button class="btn sm" data-act="reconcile" data-kind="card" data-id="${esc(c.id)}">Reconcile</button></div></div>`;
    }).join('') : '<div class="card empty"><b>💳</b>Add a credit card with its bill date and due date.<br>Tandem totals each cycle and reminds you before it is due.</div>'}
    <button class="btn primary block" data-act="editCard">Add credit card</button>
    <p class="hint">Amounts are what you logged on each card, so they may differ slightly from the bank's statement (fees, interest, EMIs).</p>`;
  },

  accounts() {
    const ym = monthOf(today()), me = meId(), sum = l => l.reduce((s, e) => s + e.amount, 0);
    const as = liveAccts().sort((a, b) => (a.owner === me ? 0 : 1) - (b.owner === me ? 0 : 1));
    const loose = incomes().filter(e => monthOf(e.date) === ym && !e.accountId);
    return `<p class="hint" style="margin:0 0 10px">${esc(monthName(ym))}</p>${as.length ? as.map(a => { const { i, o } = acctFlow(a, e => monthOf(e.date) === ym), since = a.balance0At ? acctFlow(a, e => e.createdAt > a.balance0At) : null;
      return `<div class="card"><div class="rowflex between"><div class="grow"><b>${esc(a.name)}</b><br><small class="muted">${esc(you(a.owner))}${a.upiApp ? ' · ' + esc(a.upiApp) : ''}</small></div><button class="btn sm" data-act="reconcile" data-kind="acct" data-id="${esc(a.id)}">Reconcile</button><button class="btn sm" data-act="editAcct" data-id="${esc(a.id)}">Edit</button></div>
        <div class="kpis" style="margin-top:12px"><div class="kpi"><small>Money in</small><b class="pos">${money0(i)}</b></div><div class="kpi"><small>Out</small><b>${money0(o)}</b></div><div class="kpi"><small>Net</small><b class="${i - o < 0 ? 'neg' : ''}">${money0(i - o)}</b></div></div>${since ? `<p class="hint">Balance ≈ <b>${money0(a.balance0 + since.i - since.o)}</b> · from ${money0(a.balance0)} you entered on ${niceDate(toStr(new Date(a.balance0At)))}</p>` : ''}</div>`; }).join('') : '<div class="card empty"><b>🏦</b>Add each bank account with the UPI app you use for it.<br>Then pick the account when you log a payment or money coming in.</div>'}
    ${loose.length ? `<p class="hint">${money0(sum(loose))} of money in this month is not tied to an account.</p>` : ''}
    <div class="rowflex"><button class="btn primary grow" data-act="editAcct">Add account</button><button class="btn grow" data-act="addIncome">Add money in</button><button class="btn grow" data-act="addTransfer">Transfer</button></div>
    <p class="hint">Totals are what you logged against each account this month. For a running balance, open an account and type what it holds today; settlements between the two of you are not counted in it.</p>`;
  },

  recurring() {
    const rs = state.recurring.filter(r => !r.deleted);
    return `<div class="card">${rs.length ? `<div class="list">${rs.map(r => `<button class="row" data-act="editRec" data-id="${esc(r.id)}"><span class="ico">${esc(cat(r.category).emoji)}</span><span class="rmain"><b>${esc(r.description)}</b><small>${r.schedule === 'ask' ? 'Asks ' + esc(dayText(r.days)) + ' from ' + esc(r.askTime) : 'Day ' + r.dayOfMonth} · ${esc(you(r.paidBy))} · ${esc(modeLabel(r.mode))}${r.active ? '' : ' · paused'}</small></span><span class="ramt"><b>${money(r.amount)}</b></span></button>`).join('')}</div>` : '<div class="empty"><b>🔁</b>Rent, Wi-Fi, streaming, EMIs.<br>Added automatically each month, or asked on the days you choose<br>(office lunch, cab) so you just tap Add or No.</div>'}</div>
    <button class="btn primary block" data-act="editRec">Add recurring expense</button>`;
  },

  budgets() {
    const b = S.budgets, st = stats(monthOf(today()));
    return `<div class="card"><h3>Monthly household budget</h3><div class="budrow"><span>Overall limit</span><input class="in" inputmode="decimal" data-bud="_total" value="${b._total || ''}" placeholder="No limit"></div><p class="hint">Shown on Home with what is left per day.</p></div>
    <div class="card"><h3>Per category</h3>${S.activeCats.map(c => `<div class="budrow"><span>${esc(c.emoji + ' ' + c.name)}<br><small class="muted">${money0(st.byCat[c.id] || 0)} this month</small></span><input class="in" inputmode="decimal" data-bud="${esc(c.id)}" value="${b[c.id] || ''}" placeholder="—"></div>`).join('')}</div>`;

  categories() {
    return `<div class="card"><h3>Emoji · name</h3>${S.activeCats.map(c => `<div class="catrow" data-cat="${esc(c.id)}"><input class="in" data-k="emoji" value="${esc(c.emoji)}" maxlength="4" aria-label="Emoji"><input class="in" data-k="name" value="${esc(c.name)}" maxlength="30" aria-label="Name"><button class="x" data-act="delCat" data-id="${esc(c.id)}" aria-label="Remove">✕</button></div>`).join('')}
    <button class="btn block" data-act="addCat" style="margin-top:6px">Add category</button></div><p class="hint">Removing a category keeps old expenses as they are.</p>
    <div class="card"><h3>Platforms</h3><div class="chips">${S.platforms.map(n => `<button class="chip" data-act="delPlat" data-n="${esc(n)}">${esc(n)} ✕</button>`).join('')}<button class="chip on" data-act="addPlat">+ Add</button></div><p class="hint">Apps and sites you order from. Tap one to remove it from the list.</p></div>`;
  },

  friends() {
    const dues = friendDues(), me = meId(), fs = friendsAll().filter(x => !x.archived);
    const mine = dues.filter(d => d.e.paidBy === me).reduce((s, d) => s + d.amount, 0), theirs = dues.reduce((s, d) => s + d.amount, 0) - mine;
    const rows = fs.map(fr => { const d = dues.filter(x => x.id === fr.id); return { fr, n: d.length, amt: round2(d.reduce((s, x) => s + x.amount, 0)) }; }).sort((a, b) => b.amt - a.amt);
    return `<div class="card hero"><h3>Friends owe</h3><div class="big">${money(mine + theirs)}</div><div class="sub">${money(mine)} to you · ${money(theirs)} to ${esc(uname(otherId()))}</div></div>
    <div class="card">${rows.length ? `<div class="list">${rows.map(r => `<button class="row" data-act="friend" data-id="${esc(r.fr.id)}"><span class="avatar" style="background:var(--surface2);color:var(--ink)">${esc((r.fr.name[0] || '?').toUpperCase())}</span><span class="rmain"><b>${esc(r.fr.name)}</b><small>${r.n ? r.n + ' open item' + (r.n > 1 ? 's' : '') : 'All clear'}</small></span><span class="ramt"><b class="${r.amt ? 'pos' : 'muted'}">${money(r.amt)}</b></span></button>`).join('')}</div>` : '<div class="empty"><b>👥</b>Add friends here, then pick them on any expense<br>to split the bill with them.</div>'}</div>
    <button class="btn primary block" data-act="addFriend">Add friend</button>
    <p class="hint">A friend's part of a bill is kept out of your own spending and is owed to whoever paid.</p>`;
  },

  settings() {
    const me = user(meId()), u1 = uname('u1'), u2 = uname('u2'), sp = S.split;
    const np = 'Notification' in window ? Notification.permission : 'unsupported';
    return `<div class="card"><h3>Your profile</h3>
      <label class="f"><span>Name</span><input class="in" id="pName" value="${esc(me.name)}" maxlength="40"></label>
      <label class="f"><span>Email for card reminders</span><input class="in" id="pEmail" type="email" value="${esc(me.email)}" placeholder="you@example.com"></label>
      <button class="btn primary" data-act="saveProfile">Save profile</button>
      ${cfg.demo ? '<button class="btn" data-act="switchUser" style="margin-left:8px">Switch user (demo)</button>' : ''}</div>
    <div class="card"><h3>Default split for shared expenses</h3>
      <div class="rowflex between" style="margin-bottom:6px"><b id="splitA">${esc(u1)} ${sp}%</b><b id="splitB">${esc(u2)} ${100 - sp}%</b></div>
      <input type="range" id="splitR" min="0" max="100" step="5" value="${sp}"><p class="hint">Used when you pick “Shared”. Set it to 50/50, or proportional to income. Existing expenses are not changed.</p></div>
    <div class="card"><h3>Credit card reminders</h3>
      <label class="f"><span>Remind me this many days before due date</span><input class="in" id="remind" inputmode="numeric" value="${S.remind}"></label>
      <div class="chips"><button class="btn sm" data-act="askNotify" ${np === 'granted' || np === 'unsupported' ? 'disabled' : ''}>${np === 'granted' ? 'Device notifications on ✓' : np === 'unsupported' ? 'Notifications not supported here' : 'Turn on device notifications'}</button>
      ${cfg.demo ? '' : '<button class="btn sm" data-act="testEmail">Send test email</button>'}</div>
      <p class="hint">Email reminders arrive even when the app is closed (bill generated, ${S.remind} days before, 1 day before, and on the due date). Device notifications appear when you open the app.</p></div>
    ${cfg.demo ? '' : `<div class="card"><h3>Monthly summary email</h3><div class="seg"><button class="${state.settings.monthlyEmail === false ? '' : 'on'}" data-act="monthlyEmail" data-v="1">On</button><button class="${state.settings.monthlyEmail === false ? 'on' : ''}" data-act="monthlyEmail" data-v="">Off</button></div><p class="hint">On the 1st, each of you gets last month's totals, top categories and what is still open to settle.</p></div>`}
    ${cfg.demo ? '' : `<div class="card"><h3>Timed prompts when the app is closed</h3><p class="hint" style="margin:0 0 10px">For “Ask me” recurring items: a notification with Add / Not today on Android, or a Shortcuts pop-up on iPhone.</p><button class="btn" data-act="quickSetup">Set up on this phone</button></div>`}
    ${cfg.demo ? '' : `<div class="card"><h3>Backups</h3><p class="hint" style="margin:0 0 10px">On the 1st of each month a full copy of the sheet is saved to the sheet owner's Google Drive.${meta.lastBackup ? ` Last one made from this device: <a href="${esc(meta.lastBackup.url)}" target="_blank" rel="noopener">${niceDate(toStr(new Date(meta.lastBackup.at)))}</a>.` : ''}</p><button class="btn" data-act="backupNow">Back up now</button></div>`}
    <div class="card"><h3>Currency symbol</h3><input class="in" id="cur" value="${esc(S.cur)}" maxlength="4" style="max-width:120px"></div>
    ${cfg.demo ? '' : `<div class="card"><h3>Google sign-in</h3>
      ${me.googleEmail ? `<p style="margin-bottom:10px">Linked to <b>${esc(me.googleEmail)}</b>. You can sign in with Google on any device.</p><button class="btn" data-act="unlinkGoogle">Unlink</button>`
        : state.settings.googleClientId ? '<p class="hint" style="margin:0 0 10px">Link your Google account, then sign in with one tap instead of a password.</p><div id="gLink" style="min-height:44px"></div>'
        : '<p class="hint" style="margin:0 0 10px">One-time setup: create a free Google client ID (steps in SETUP.md) and paste it here. Then each of you links your Google account.</p>'}
      <label class="f" style="margin:14px 0 0"><span>Google client ID</span><input class="in" id="gCid" value="${esc(state.settings.googleClientId || '')}" placeholder="…apps.googleusercontent.com" autocapitalize="off" autocomplete="off"></label></div>
    <div class="card"><h3>Password</h3><label class="f"><span>Current password</span><input class="in" id="pwOld" type="password" autocomplete="current-password"></label><label class="f"><span>New password</span><input class="in" id="pwNew" type="password" autocomplete="new-password"></label><button class="btn" data-act="changePw">Change password</button></div>
    <div class="card"><h3>Partner & devices</h3><p class="hint" style="margin:0 0 10px">Send this link to your partner or open it on your other devices. It connects the app to your sheet; each person still signs in.</p><button class="btn" data-act="shareLink">Copy setup link</button></div>`}
    <div class="card"><h3>This device</h3><div class="chips"><button class="btn" data-act="logout">${cfg.demo ? 'Exit demo' : 'Sign out'}</button><button class="btn danger" data-act="resetDevice">Reset this device</button></div>
    <p class="hint">${queue.length ? queue.length + ' change(s) waiting to sync. ' : ''}${lastSync ? 'Last synced ' + new Date(lastSync).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) + '.' : ''}</p></div>`;
  }
};

function expFiltered() {
  const f = ui.filter, me = meId(), q = f.q.trim().toLowerCase();
  let list = live().filter(e => q ? true : monthOf(e.date) === ui.month);
  return list.filter(e => {
    if (q && !(e.description + ' ' + e.notes + ' ' + cat(e.category).name + ' ' + (e.platform || '') + ' ' + (e.platform && e.device === 'office' ? 'office' : '')).toLowerCase().includes(q)) return false;
    if (f.cat && e.category !== f.cat && !(e.cats || []).some(c => c.id === f.cat)) return false;
    if (f.plat && e.platform !== f.plat) return false;
    if (f.mode && e.mode !== f.mode) return false;
    if (f.who === 'me' && e.paidBy !== me) return false;
    if (f.who === 'other' && e.paidBy === me) return false;

function openSettle(preIds) {
  const me = meId(), ot = otherId();
  const items = openItems().sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  if (!items.length) return toast('Nothing to settle');
  const sel = new Set(preIds || items.map(e => e.id));

  const months = [...new Set(items.map(e => monthOf(e.date)))];
  const inMonth = ym => items.filter(e => monthOf(e.date) === ym);
  const sum = list => round2(list.reduce((s, e) => s + lentOf(e), 0));
  const signed = v => `<b class="${v > 0 ? 'pos' : 'neg'}">${v > 0 ? '+' : '−'}${money(Math.abs(v))}</b>`;
  const body = openSheet('Settle up', `
    <div class="card hero" style="margin-bottom:10px"><h3 id="stHead"></h3><div class="big" id="stAmt"></div><div class="sub" id="stSub"></div></div>
    <div class="chips" style="margin-bottom:4px">${chip(false, 'data-pick="all"', 'Everything')}${months.slice(0, 5).map(m => chip(false, `data-pick="${m}"`, 'Only ' + esc(monthShort(m)))).join('')}${chip(false, 'data-pick="none"', 'Clear')}</div>
    <p class="hint" style="margin-bottom:2px">Tick what this payment covers. <span class="pos">+</span> is owed to you, <span class="neg">−</span> is what you owe.</p>
    ${months.map(m => `<button type="button" class="dayhead mhead" data-pick="${m}" style="width:100%"><span>${esc(monthName(m))}</span><span>${money(sum(inMonth(m)))}</span></button><div class="list">${inMonth(m).map(e => `<button type="button" class="row srow" data-tog="${esc(e.id)}"><span class="chk"></span><span class="rmain"><b>${esc(e.description)}</b><small>${niceDate(e.date)} · ${esc(you(e.paidBy))} paid ${money(e.amount)}</small></span><span class="ramt">${signed(lentOf(e))}</span></button>`).join('')}</div>`).join('')}
    <div class="stick"><div class="chips" style="margin-bottom:10px">${[MODES[0], MODES[3], MODES[4]].map(m => chip(m[0] === f.mode, `data-mode="${m[0]}"`, m[2] + ' ' + m[1])).join('')}</div>
    <button class="btn primary block" data-save="1" id="stBtn"></button><button class="btn block" data-part="1" style="margin-top:8px">Pay a part instead</button></div>`);
  const chosen = () => items.filter(e => sel.has(e.id));

    const c = chosen(), n = sum(c);
    $$('[data-tog]', body).forEach(r => r.classList.toggle('on', sel.has(r.dataset.tog)));
    $$('[data-mode]', body).forEach(r => r.classList.toggle('on', r.dataset.mode === f.mode));
    $('#stHead', body).textContent = !c.length ? 'Nothing selected' : Math.abs(n) < 0.005 ? 'These cancel out' : n > 0 ? `${uname(ot)} pays you` : `You pay ${uname(ot)}`;
    $('#stAmt', body).textContent = money(Math.abs(n));
    const mine = round2(c.filter(e => lentOf(e) > 0).reduce((s, e) => s + lentOf(e), 0)), theirs = round2(-c.filter(e => lentOf(e) < 0).reduce((s, e) => s + lentOf(e), 0));
    $('#stSub', body).textContent = `${c.length} of ${items.length} open expenses · you covered ${money(mine)} for ${uname(ot)}, ${uname(ot)} covered ${money(theirs)} for you`;
    const btn = $('#stBtn', body); btn.disabled = !c.length;
    btn.textContent = !c.length ? 'Select expenses' : Math.abs(n) < 0.005 ? `Mark ${c.length} as settled — nothing to pay` : `Record ${money(Math.abs(n))} · settles ${c.length} expense${c.length > 1 ? 's' : ''}`;
  };
  body.onclick = ev => {
    const t = ev.target.closest('[data-tog]');
    if (t) { sel.has(t.dataset.tog) ? sel.delete(t.dataset.tog) : sel.add(t.dataset.tog); return refresh(); }
    if (ev.target.closest('[data-part]')) return openPart();

/* one friend: what they owe, tick what they have paid back, share a statement */
function friendStatement(id) {
  const d = friendDues().filter(x => x.id === id).sort((a, b) => a.e.date.localeCompare(b.e.date)); if (!d.length) return '';
  const tot = round2(d.reduce((s, x) => s + x.amount, 0)), by = {};
  d.forEach(x => (by[x.e.paidBy] = round2((by[x.e.paidBy] || 0) + x.amount)));
  return [`Hi ${friendName(id)}, here is what is pending:`, '', ...d.map(x => `• ${niceDate(x.e.date)} · ${x.e.description}: ${money(x.amount)} (your part of ${money(x.e.amount)}, paid by ${uname(x.e.paidBy)})`), '', `Total: ${money(tot)}`,
    ...Object.keys(by).map(u => `Pay ${uname(u)}: ${money(by[u])}`)].join('\n');
}

    <div class="stick">${items.length ? '<button class="btn primary block" data-recv="1" id="frBtn"></button><div class="rowflex" style="margin-top:8px"><button class="btn grow" data-frpart="1">Received a part</button><button class="btn grow" data-stmt="1">Share statement</button></div>' : ''}
    <div class="rowflex" style="margin-top:8px"><button class="btn grow" data-ren="1">Rename</button><button class="btn danger grow" data-rm="1">Remove</button></div></div>`);
  const refresh = () => { const b = $('#frBtn', body); if (!b) return; const c = items.filter(x => sel.has(x.e.id)); $$('[data-tog]', body).forEach(r => r.classList.toggle('on', sel.has(r.dataset.tog))); b.disabled = !c.length; b.textContent = c.length ? `Mark ${money(tot(c))} received` : 'Select items'; };

    <button class="btn danger block" data-undo="1" style="margin-top:14px">Undo this settlement</button>

  body.onclick = ev => {

function openTransfer(existing, preset) {

    const accts = liveAccts().filter(a => a.owner === f.paidBy), cards = liveCards().sort((a, b) => (a.owner === f.paidBy ? 0 : 1) - (b.owner === f.paidBy ? 0 : 1));
    if (!existing && !accts.some(a => a.id === f.accountId)) f.accountId = accts.length === 1 ? accts[0].id : (accts.find(a => a.id === prefs.lastAcct) || {}).id || '';

      ${f.category === 'card_bill' ? `<div class="fsec"><span class="flabel">Which card</span>${cards.length ? `<div class="chips">${cards.map(c => { const i = cardInfo(c); return chip(f.cardId === c.id, `data-set="cardId" data-val="${esc(c.id)}"`, esc(c.name) + (i.billed > 0 && !i.paid ? ' · ' + money0(i.billed) + ' due' : '')); }).join('')}</div><p class="hint">Saving this also marks the card's current bill as paid.</p>` : '<p class="hint" style="margin:0">Add the card first under More → Credit cards.</p>'}</div>` : ''}
      ${f.category === 'own' ? `<div class="fsec"><span class="flabel">To account</span><div class="chips">${liveAccts().filter(a => a.id !== f.accountId).map(a => chip(f.toAccountId === a.id, `data-set="toAccountId" data-val="${esc(a.id)}"`, esc(a.name + (a.owner === f.paidBy ? '' : ' (' + uname(a.owner) + ')')))).join('') || '<span class="hint">Add a second account first.</span>'}</div></div>` : ''}
      <div class="fsec"><div class="rowflex"><input class="in" type="date" id="tDate" value="${esc(f.date)}" max="2099-12-31"><input class="in" id="tNotes" placeholder="Notes" value="${esc(f.notes)}" maxlength="300"></div></div>
      <div class="stick"><button class="btn primary block" data-save="1">${existing ? 'Save changes' : 'Save transfer'}</button>${existing ? '<button class="btn danger block" data-del="1" style="margin-top:8px">Delete</button>' : ''}</div>`;
  };
  const save = () => {

    const card = liveCards().find(c => c.id === f.cardId), from = liveAccts().find(x => x.id === f.accountId), to = liveAccts().find(x => x.id === f.toAccountId);

    mutate('Expenses', { id: f.id, type: 'transfer', date: f.date, amount: a, description, category: k, paidBy: f.paidBy, mode: '', cardId: k === 'card_bill' ? card.id : '', accountId: f.accountId || '', toAccountId: k === 'own' ? to.id : '', splitType: '', share1: 0, share2: 0, notes: f.notes.trim(), recurringId: '', settledBy: '', createdBy: existing ? existing.createdBy : me, createdAt: f.createdAt || Date.now(), deleted: false }, true);
    if (k === 'card_bill' && !existing) { const i = cardInfo(card); if (i.billed > 0 && !i.paid) mutate('BillPayments', { id: card.id + '_' + i.stmt, cardId: card.id, cycle: i.stmt, paidOn: today(), paidBy: f.paidBy, deleted: false }, true); }
    closeSheet(); render(); toast(existing ? 'Updated' : `Transfer of ${money(a)} saved`);
  };
  body.onclick = ev => {
    const s = ev.target.closest('[data-set]');
    if (s) { collect(); f[s.dataset.set] = s.dataset.val;
      if (s.dataset.set === 'cardId' && !calc(f.amount)) { const c = liveCards().find(x => x.id === f.cardId), i = c && cardInfo(c); if (i && i.billed > 0 && !i.paid) f.amount = i.billed; }
      return draw(); }
    if (ev.target.closest('[data-toexpense]')) { collect(); return openExpense(null, { amount: f.amount, date: f.date }); }
    if (ev.target.closest('[data-toincome]')) { collect(); return openIncome(null, { amount: f.amount, date: f.date }); }
    if (ev.target.closest('[data-save]')) return save();

  };
  body.onkeydown = ev => { if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') { ev.preventDefault(); save(); } };
  draw();
  if (!existing) setTimeout(() => { const i = $('#tAmt', body); i && i.focus(); }, 60);
}

/* a refund is a negative copy of the expense, split the same way, so spending, card bills and what you owe each other all correct themselves */
function openRefund(orig, existing) {
  if (existing) {
    const o = state.expenses.find(e => e.id === existing.refundOf);
    const body = openSheet('Refund', `<div class="card hero" style="margin-bottom:10px"><h3>Refund received</h3><div class="big">${money(-existing.amount)}</div><div class="sub">${niceDate(existing.date)} · ${esc(o ? 'for ' + o.description + ' (' + money(o.amount) + ')' : existing.description)}</div></div>
      <p class="hint">Your shares went down by ${money(-existing.share1)} (${esc(uname('u1'))}) and ${money(-existing.share2)} (${esc(uname('u2'))}).${existing.settledBy ? ' Already settled between you.' : ''}</p>
      <button class="btn danger block" data-del="1">Delete this refund</button>`);
    body.onclick = ev => { if (!ev.target.closest('[data-del]')) return; if (existing.settledBy) return toast('Settled — undo the settlement first'); if (confirm('Delete this refund?')) { mutate('Expenses', { ...existing, deleted: true }); closeSheet(); toast('Refund deleted'); } };
    return;
  }
  const left = round2(orig.amount - refundedOf(orig.id));
  if (!(left > 0)) return toast('This expense is already fully refunded');
  const base = orig.share1 + orig.share2, r1 = base ? orig.share1 / base : orig.paidBy === 'u1' ? 1 : 0;
  const body = openSheet('Refund', `<p class="hint" style="margin:0 0 12px">For <b>${esc(orig.description)}</b> (${money(orig.amount)}${left < orig.amount ? ', ' + money(left) + ' not yet refunded' : ''}). It goes back the way it was paid and is split the same way.</p>
    <div class="amount"><span>${esc(S.cur)}</span><input id="rfAmt" inputmode="decimal" value="${left}"></div>
    <div class="fsec"><span class="flabel">Date received</span><input class="in" type="date" id="rfDate" value="${today()}"></div>
    <p class="hint" id="rfSum"></p>
    <button class="btn primary block" data-save="1">Record refund</button>`);
  const split = a => { const s1 = round2(a * r1); return [s1, round2(a - s1)]; };
  const upd = () => { const a = round2(calc($('#rfAmt', body).value)), [s1, s2] = split(a); $('#rfSum', body).textContent = a > 0 ? `${uname('u1')}'s share drops by ${money(s1)}, ${uname('u2')}'s by ${money(s2)}.` : ''; };
  body.oninput = upd; upd();
  body.onclick = ev => {
    if (!ev.target.closest('[data-save]')) return;
    const a = round2(calc($('#rfAmt', body).value)); if (!(a > 0)) return toast('Enter an amount'); if (a > left + 0.005) return toast(`Only ${money(left)} is left to refund`);
    const [s1, s2] = split(a);
    mutate('Expenses', { id: 'rf' + uid(), type: 'expense', date: $('#rfDate', body).value || today(), amount: -a, description: 'Refund: ' + orig.description, category: orig.category, paidBy: orig.paidBy, mode: orig.mode, cardId: orig.cardId, accountId: orig.accountId, upiApp: orig.upiApp, splitType: 'custom', splitInfo: { cm: 'amounts' }, share1: -s1, share2: -s2, friendsShare: 0, friends: [], notes: '', platform: orig.platform, device: orig.device, cats: [], refundOf: orig.id, recurringId: '', settledBy: '', createdAt: Date.now(), deleted: false });
    closeSheet(); toast(`Refund of ${money(a)} recorded`);
  };
}

/* ---- reconcile: compare what was logged with the real statement total (card) or bank balance (account) */
function openReconcile(kind, id) {
  const isCard = kind === 'card', sum = l => round2(l.reduce((s, e) => s + e.amount, 0));
  const get = () => (isCard ? liveCards() : liveAccts()).find(x => x.id === id);
  if (!get()) return;
  const dk = kind + id; let showList = false;
  const body = openSheet('Reconcile ' + get().name, '');
  const back = () => openReconcile(kind, id);
  const ctx = () => {
    const t = get();
    if (isCard) { const i = cardInfo(t), ps = shiftCycle(i.stmt, t.statementDay, -1), list = spends().filter(e => e.cardId === t.id && e.date > ps && e.date <= i.stmt); return { t, list, logged: sum(list), rid: t.id + '_' + i.stmt, date: i.stmt, from: addDays(ps, 1) }; }
    const tracked = !!t.balance0At, fl = tracked ? acctFlow(t, e => e.createdAt > t.balance0At) : { i: 0, o: 0 };
    return { t, tracked, expected: round2(t.balance0 + fl.i - fl.o), list: tracked ? live().filter(e => e.createdAt > t.balance0At && (e.accountId === t.id || e.toAccountId === t.id)) : [], rid: t.id + '_' + today(), date: today() };
  };
  const personal = (c, amount, extra) => ({ id: 'rc' + uid(), type: 'expense', date: c.date, amount, paidBy: c.t.owner, splitType: 'personal', ...computeShares(amount, c.t.owner, 'personal', 100), mode: isCard ? 'credit_card' : 'upi', cardId: isCard ? c.t.id : '', accountId: isCard ? '' : c.t.id, notes: 'Added while reconciling', recurringId: '', settledBy: '', createdAt: Date.now(), deleted: false, ...extra });
  const finish = (c, total, msg) => {
    if (isCard) setRecon(c.rid, total);
    else { mutate('Accounts', { ...c.t, balance0: total, balance0At: Date.now() + 1 }, true); setRecon(c.rid, total); }
    delete reconDraft[dk]; closeSheet(); render(); toast(msg || 'Reconciled ✓');
  };
  const draw = () => {
    const c = ctx(), raw = reconDraft[dk] ?? '', has = String(raw).trim() !== '', total = round2(calc(raw));
    const gap = !has ? 0 : isCard ? round2(total - c.logged) : round2(c.expected - total), ok = has && Math.abs(gap) < 0.5, done = recons()[c.rid];
    const who = c.t.owner === meId() ? 'you' : uname(c.t.owner);
    let box = '';
    if (!has) box = '';
    else if (!isCard && !c.tracked) box = `<div class="alert info"><span class="grow"><b>Start tracking from ${money(total)}</b><small>From now on Tandem compares what you log with this balance.</small></span></div><button class="btn primary block" data-done="1">Start tracking</button>`;
    else if (ok) box = `<div class="alert info"><span style="font-size:22px">✅</span><span class="grow"><b>It matches</b><small>Everything on this ${isCard ? 'bill' : 'account'} is logged.</small></span></div><button class="btn primary block" data-done="1">Mark reconciled</button>`;
    else if (gap > 0) box = `<div class="alert"><span style="font-size:22px">🔎</span><span class="grow"><b>${money(gap)} is not logged</b><small>${isCard ? 'The bill is higher than what you logged for this cycle.' : 'The bank has less than Tandem expected, so some spending is missing.'}</small></span></div>
      <button class="btn primary block" data-miss="1">Add a missing transaction</button>
      ${isCard ? '<button class="btn block" data-fees="1" style="margin-top:8px">It is fees / interest</button>' : ''}<button class="btn block" data-unacc="1" style="margin-top:8px">Book ${money(gap)} as Unaccounted</button>
      <p class="hint">Add what you remember; the gap shrinks each time. “Unaccounted” books the rest against ${esc(who)} only, not split, and closes the ${isCard ? 'bill' : 'month'}.</p>`;
    else box = `<div class="alert bad"><span style="font-size:22px">↩️</span><span class="grow"><b>${isCard ? 'You logged ' + money(-gap) + ' more than the bill' : money(-gap) + ' more in the bank than expected'}</b><small>${isCard ? 'Usually a refund, something logged on the wrong card, or a purchase that falls in the next bill. Check the list below.' : 'Usually money in that was not logged: a refund, a transfer, interest.'}</small></span></div>
      ${isCard ? '' : '<button class="btn primary block" data-inc="1">Add money in</button>'}
      <button class="btn block" data-credit="1" style="margin-top:8px">Book ${money(-gap)} as ${isCard ? 'a statement credit' : 'unaccounted money in'}</button>`;
    body.innerHTML = `<p class="hint" style="margin:0 0 10px">${isCard ? `Bill generated ${niceDate(c.date)} (purchases ${niceDate(c.from)} – ${niceDate(c.date)}). You logged <b>${money(c.logged)}</b> across ${c.list.length} entr${c.list.length === 1 ? 'y' : 'ies'}.` : c.tracked ? `Tandem expects <b>${money(c.expected)}</b> in this account from what you logged.` : 'This account is not being tracked yet.'}${done ? ` Last reconciled ${niceDate(done.at)} at ${money(done.total)}.` : ''}</p>
      <label class="f"><span>${isCard ? 'Total on the statement' : 'Balance in the bank right now'}</span><input class="in" id="rcTotal" inputmode="decimal" placeholder="0" value="${esc(raw)}" autocomplete="off"></label>
      ${box}
      <button class="btn block" data-match="1" style="margin-top:8px">Match a statement file instead</button>
      ${c.list.length ? `<button class="crow" data-list="1" style="margin-top:12px"><span>Logged ${isCard ? 'in this bill' : 'since last check'}</span><b>${c.list.length} entr${c.list.length === 1 ? 'y' : 'ies'}</b><i>${showList ? '▴' : '›'}</i></button>${showList ? `<div class="card" style="padding:2px 14px"><div class="list">${c.list.slice().sort((a, b) => b.date.localeCompare(a.date)).map(expRow).join('')}</div></div>` : ''}` : ''}`;
  };
  body.oninput = ev => { if (ev.target.id === 'rcTotal') reconDraft[dk] = ev.target.value; };
  body.onchange = ev => { if (ev.target.id === 'rcTotal') draw(); };
  body.onkeydown = ev => { if (ev.key === 'Enter' && ev.target.id === 'rcTotal') { ev.preventDefault(); draw(); } };
  body.onclick = ev => {
    const hit = s => ev.target.closest(s); if (hit('#rcTotal')) return;
    const c = ctx(), raw = reconDraft[dk] ?? '', total = round2(calc(raw)), gap = isCard ? round2(total - c.logged) : round2(c.expected - total);
    if (hit('[data-list]')) { showList = !showList; return draw(); }
    if (hit('[data-match]')) return openMatch(kind, id);
    if (String(raw).trim() === '') return;
    if (hit('[data-done]')) return finish(c, total, !isCard && !c.tracked ? 'Tracking this balance from now' : undefined);
    if (hit('[data-miss]')) return openExpense(null, isCard ? { date: c.date, paidBy: c.t.owner, mode: 'credit_card', cardId: c.t.id } : { paidBy: c.t.owner, mode: 'upi', accountId: c.t.id }, back);
    if (hit('[data-inc]')) return openIncome(null, { paidBy: c.t.owner, accountId: c.t.id, category: 'other_in' }, back);
    if (hit('[data-fees]')) { const a = round2(calc(prompt('Fees and interest on this bill', String(gap)) || '')); if (!(a > 0)) return; mutate('Expenses', personal(c, a, { description: 'Card fees & interest', category: 'fees' }), true); render(); toast(`${money(a)} fees added`); return draw(); }
    if (hit('[data-unacc]') && gap > 0) { mutate('Expenses', personal(c, gap, { description: 'Unaccounted (' + c.t.name + ')', category: 'unaccounted', notes: `${isCard ? 'Statement' : 'Bank balance'} ${money(total)}; could not be matched to logged entries` }), true); return finish(c, total, `${money(gap)} booked as Unaccounted`); }
    if (hit('[data-credit]') && gap < 0) {
      if (isCard) mutate('Expenses', personal(c, gap, { description: 'Statement credit (' + c.t.name + ')', category: 'unaccounted', notes: 'Logged more than the statement total' }), true);

/* ---- match a downloaded statement (CSV) against what was logged, and list only what is missing */
function openMatch(kind, id) {

    const mine = spends().filter(e => (isCard ? e.cardId : e.accountId) === t.id && e.amount > 0), used = new Set(), seen = {}, missing = [], dates = [];
    let matched = 0, credits = 0;
    for (const r of data.rows) {
      const date = parseDate(r[map.date]), rawD = String(r[map.debit] || ''); let a = amt(rawD);
      if (!date || !a) continue;
      if (a < 0 || /cr\b/i.test(rawD) || (map.credit !== '' && amt(r[map.credit]) > 0 && !(a > 0))) { credits++; continue; }
      dates.push(date);
      const hit = mine.find(e => !used.has(e.id) && Math.abs(e.amount - a) <= 1 && Math.abs(diffDays(e.date, date)) <= 3);
      if (hit) { used.add(hit.id); matched++; continue; }
      const description = String(r[map.desc] || 'Statement entry').replace(/\s+/g, ' ').slice(0, 80), key = `${t.id}|${date}|${description}|${a}`; seen[key] = (seen[key] || 0) + 1;
      let hsh = 5381; for (const ch of key + '|' + seen[key]) hsh = ((hsh << 5) + hsh + ch.charCodeAt(0)) >>> 0;
      const sid = 'st_' + hsh.toString(36); if (state.expenses.some(e => e.id === sid)) { matched++; continue; }
      missing.push({ id: sid, date, amount: a, description });
    }
    dates.sort(); const lo = dates[0], hi = dates[dates.length - 1];

    return { matched, missing, credits, extra };
  };
  const draw = () => {
    if (!data) { body.innerHTML = `<p class="hint" style="margin:0 0 12px">Download this ${isCard ? "card's" : "account's"} statement from your bank as CSV (or Excel, then save as CSV) and pick it here. Tandem lists only the payments it cannot find among what you logged.</p>
      <input class="in" type="file" id="mFile" accept=".csv,.tsv,.txt,text/csv"><textarea class="in" id="mText" rows="5" placeholder="…or paste the rows here" style="margin-top:10px"></textarea>

    body.innerHTML = `<div class="two">${FIELDS.map(([k, label]) => `<label class="f"><span>${esc(label)}</span><select class="in" data-map="${k}">${opt(k)}</select></label>`).join('')}</div>
      <div class="alert ${r.missing.length ? '' : 'info'}"><span class="grow"><b>${r.missing.length ? r.missing.length + ' payment' + (r.missing.length > 1 ? 's' : '') + ' not logged' : 'Nothing is missing'}</b><small>${r.matched} already logged${r.credits ? ' · ' + r.credits + ' credits ignored' : ''}</small></span></div>
      ${r.missing.length ? `<div class="list">${r.missing.map(m => `<button type="button" class="row srow ${off.has(m.id) ? '' : 'on'}" data-tog="${esc(m.id)}"><span class="chk"></span><span class="rmain"><b>${esc(m.description)}</b><small>${niceDate(m.date)} · ${esc(cat(guessCat(m.description.toLowerCase()) || 'other').name)}</small></span><span class="ramt"><b>${money(m.amount)}</b></span></button>`).join('')}</div>
      <div class="fsec" style="margin-top:12px"><span class="flabel">Add them as</span><div class="seg"><button type="button" class="${split === 'shared' ? 'on' : ''}" data-split="shared">Shared ${sp}/${100 - sp}</button><button type="button" class="${split === 'personal' ? 'on' : ''}" data-split="personal">Just ${esc(who)}</button></div><p class="hint">You can open any of them afterwards to change the category or split.</p></div>` : ''}
      ${r.extra.length ? `<p class="hint">${r.extra.length} logged entr${r.extra.length === 1 ? 'y is' : 'ies are'} not on this statement (wrong ${isCard ? 'card' : 'account'}, or a later statement?): ${esc(r.extra.slice(0, 4).map(e => e.description + ' ' + money(e.amount)).join(', '))}${r.extra.length > 4 ? '…' : ''}</p>` : ''}

  };
  const load = text => {
    const all = parseCsv(text), hi = all.slice(0, 40).findIndex(r => r.some(c => /date/i.test(c)) && r.some(c => /amount|debit|withdraw|spent/i.test(c)));      // banks put junk lines above the real header

    FIELDS.forEach(([k, , re]) => { const i = data.heads.findIndex((hd, j) => !used.has(j) && re.test(hd)); map[k] = i >= 0 ? i : ''; if (i >= 0) used.add(i); });
    draw();
  };

    }

  draw();
}

/* ---- import from a CSV (your old sheet, a bank statement, or Tandem's own export) */
function parseCsv(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',' || c === '\t') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; rows.push(row); row = []; }
    else cur += c;
  }
  row.push(cur); rows.push(row);

}
function parseDate(v) {
  const s = String(v || '').trim(), MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  let y, m, d, x;
  if ((x = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) [, y, m, d] = x;
  else if ((x = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) [, d, m, y] = x;                    // day first, as in India
  else if ((x = s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[A-Za-z]*[-\s,]*(\d{2,4})/))) { d = x[1]; m = MON[x[2].toLowerCase()]; y = x[3]; }
  else if ((x = s.match(/^([A-Za-z]{3})[A-Za-z]*\s+(\d{1,2}),?\s+(\d{4})/))) { m = MON[x[1].toLowerCase()]; d = x[2]; y = x[3]; }
  y = Number(y); m = Number(m); d = Number(d); if (y < 100) y += 2000;
  return y > 1999 && m >= 1 && m <= 12 && d >= 1 && d <= dim(y, m) ? `${y}-${pad(m)}-${pad(d)}` : '';
}

      <div class="rowflex" style="margin-top:10px"><button class="btn primary grow" data-savetopic="1">Save & send test</button>${topic0 ? '<button class="btn danger" data-offtopic="1">Turn off</button>' : ''}</div></div>
    <div class="card"><h3>iPhone · Shortcuts pop-up</h3>
      <p class="hint" style="margin:0 0 10px">Shortcuts app → Automation → + → Time of Day (pick time and days, Run Immediately) → New Blank Automation → add <b>Choose from Menu</b> with options Add and No → under each, add <b>Get Contents of URL</b> and paste the matching link.</p>
      ${items.map(r => `<div class="rowflex between" style="padding:6px 0"><span class="grow"><b>${esc(r.description)}</b><br><small class="muted">${esc(dayText(r.days))} · ${esc(r.askTime)}</small></span><button class="btn sm" data-copy="${esc(link(r, 'add'))}">Copy Add link</button><button class="btn sm" data-copy="${esc(link(r, 'skip'))}">Copy No link</button></div>`).join('') || '<p class="hint" style="margin:0">Links appear here once you have an “Ask me” item.</p>'}</div>
    <p class="hint">These links can only add or skip your own “Ask me” items for today. If one leaks, tap Reset links.</p>
    <button class="btn block" data-reset="1">Reset links</button>`);
  body.onclick = async ev => {
    const hit = s => ev.target.closest(s);
    if (hit('[data-gen]')) { $('#qTopic', body).value = 'tandem-' + uid() + uid(); return; }
    const c = hit('[data-copy]'); if (c) { try { await navigator.clipboard.writeText(c.dataset.copy); toast('Link copied'); } catch { prompt('Copy this link', c.dataset.copy); } return; }
    if (hit('[data-savetopic]')) {
      const t = $('#qTopic', body).value.trim(); if (!/^[A-Za-z0-9_-]{8,60}$/.test(t)) return toast('Use 8+ letters, numbers, - or _ (tap New for a random one)');
      setSetting('ntfy_' + me, t); toast('Saving…');
      try { await api('ntfyTest', { token: session.token, topic: t }); toast('Test sent — check the ntfy app'); } catch (e) { toast(e.message); }
      return;
    }
    if (hit('[data-offtopic]')) { setSetting('ntfy_' + me, ''); closeSheet(); return toast('Android prompts turned off'); }
    if (hit('[data-reset]') && confirm('Old links stop working. Shortcuts will need the new links. Continue?')) { try { const r = await api('quickKey', { token: session.token, reset: true }); openQuick(r.key); toast('Links reset'); } catch (e) { toast(e.message); } }
  };
}

    const pm = ev.target.closest('[data-past]');
    if (pm) { const list = past(pm.dataset.past); if (!list.length || !confirm(`File ${list.length} earlier ${modeLabel(pm.dataset.past)} payment${list.length > 1 ? 's' : ''} under ${a.name}?`)) return;
      list.forEach(e => mutate('Expenses', { ...e, accountId: a.id, upiApp: e.mode === 'upi' && !e.upiApp ? a.upiApp : e.upiApp }, true)); render(); toast(`${list.length} payment${list.length > 1 ? 's' : ''} filed under ${a.name}`); collect(); return draw(); }
    const u = ev.target.closest('[data-upi]'); if (u) { collect(); f.upiApp = f.upiApp === u.dataset.upi ? '' : u.dataset.upi; return draw(); }
    if (ev.target.closest('[data-save]')) { collect(); if (!f.name.trim()) return toast('Give the account a name'); const nb = $('#aBal', body).value.trim(); mutate('Accounts', { id: f.id, owner: f.owner, name: f.name.trim(), upiApp: f.upiApp.trim(), balance0: nb ? round2(calc(nb)) : f.balance0 || 0, balance0At: nb ? Date.now() : f.balance0At || 0, deleted: false }); closeSheet(); toast('Account saved'); }

  f.schedule = f.schedule || 'monthly'; f.days = f.days || '1,2,3,4,5'; f.askTime = f.askTime || '13:00';
  const body = openSheet(r ? 'Edit recurring' : 'Add recurring expense', '');

  const draw = () => {
    const cards = liveCards().filter(c => c.owner === f.paidBy), accts = liveAccts().filter(a => a.owner === f.paidBy), sp = S.split, o = other(f.paidBy), ask = f.schedule === 'ask', days = f.days.split(',');

      <label class="f"><span>Description</span><input class="in" id="rDesc" value="${esc(f.description)}" placeholder="${ask ? 'e.g. Office lunch' : 'e.g. Rent, Netflix'}" maxlength="80"></label>

      ${ask ? `<label class="f"><span>Ask from</span><input class="in" type="time" id="rTime" value="${esc(f.askTime)}"></label>` : `<label class="f"><span>Day of month</span><select class="in" id="rDay">${Array.from({ length: 31 }, (_, i) => `<option ${i + 1 === f.dayOfMonth ? 'selected' : ''}>${i + 1}</option>`).join('')}</select></label>`}</div>
      ${ask ? `<div class="fsec"><span class="flabel">Ask on</span><div class="chips">${[1, 2, 3, 4, 5, 6, 0].map(d => chip(days.includes(String(d)), `data-day="${d}"`, DAYN[d])).join('')}</div><p class="hint">On these days, from that time, Home shows “Add this?” with Add and No. Nothing is added until you tap Add, and only the person paying is asked.</p></div>` : ''}
      <div class="fsec"><span class="flabel">Paid by</span><div class="seg">${['u1', 'u2'].map(id => `<button type="button" class="${f.paidBy === id ? 'on' : ''}" data-set="paidBy" data-val="${id}">${esc(you(id))}</button>`).join('')}</div></div>
      <div class="grid2" style="grid-template-columns:1fr 1fr;margin-bottom:0"><label class="f"><span>Payment mode</span><select class="in" id="rMode">${MODES.map(m => `<option value="${m[0]}" ${f.mode === m[0] ? 'selected' : ''}>${m[1]}</option>`).join('')}</select></label>
      ${f.mode === 'credit_card' && cards.length ? `<label class="f"><span>Card</span><select class="in" id="rCard">${cards.map(c => `<option value="${esc(c.id)}" ${f.cardId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>`
        : ACCT_MODES.includes(f.mode) && accts.length ? `<label class="f"><span>Account</span><select class="in" id="rAcct"><option value="">Not set</option>${accts.map(a => `<option value="${esc(a.id)}" ${f.accountId === a.id ? 'selected' : ''}>${esc(acctLabel(a))}</option>`).join('')}</select></label>` : '<span></span>'}</div>
      <div class="fsec"><span class="flabel">Split</span><div class="chips">${chip(f.splitType === 'shared', 'data-set="splitType" data-val="shared"', `Shared ${sp}/${100 - sp}`)}${chip(f.splitType === 'personal', 'data-set="splitType" data-val="personal"', `Just ${esc(youL(f.paidBy))}`)}${chip(f.splitType === 'other', 'data-set="splitType" data-val="other"', `All ${esc(youL(o))}${o === meId() ? 'rs' : "'s"}`)}</div></div>
      <div class="fsec"><div class="seg"><button type="button" class="${f.active ? 'on' : ''}" data-set="active" data-val="1">Active</button><button type="button" class="${f.active ? '' : 'on'}" data-set="active" data-val="">Paused</button></div></div>
      <button class="btn primary block" data-save="1">Save</button>${r ? '<button class="btn danger block" data-del="1" style="margin-top:8px">Delete</button>' : ''}`;
  };
  body.onclick = ev => {
    const s = ev.target.closest('[data-set]');
    if (s) { collect(); f[s.dataset.set] = s.dataset.set === 'active' ? !!s.dataset.val : s.dataset.val; draw(); return; }
    const dy = ev.target.closest('[data-day]');
    if (dy) { collect(); const set = new Set(f.days.split(',').filter(Boolean)); set.has(dy.dataset.day) ? set.delete(dy.dataset.day) : set.add(dy.dataset.day); f.days = [...set].join(','); return draw(); }
    if (ev.target.closest('[data-save]')) {
      collect(); const a = round2(num(f.amount)), ask = f.schedule === 'ask';
      if (!(a > 0) || !f.description.trim()) return toast('Add an amount and description');
      if (ask && !f.days) return toast('Pick at least one day');
      mutate('Recurring', { id: f.id, description: f.description.trim(), amount: a, category: f.category, paidBy: f.paidBy, mode: f.mode, cardId: f.mode === 'credit_card' ? f.cardId : '', accountId: ACCT_MODES.includes(f.mode) ? f.accountId : '', splitType: f.splitType, payerPct: f.payerPct, dayOfMonth: f.dayOfMonth, active: f.active, schedule: f.schedule, days: ask ? f.days : '', askTime: ask ? f.askTime : '', startDate: ask ? ((r && r.schedule === 'ask' && r.startDate) || today()) : '', deleted: false }, true);
      closeSheet(); runRecurring(); render(); tick(); toast('Saved');
    }
    if (ev.target.closest('[data-del]') && confirm('Delete this recurring expense? Entries already added stay.')) { mutate('Recurring', { ...r, deleted: true }); closeSheet(); }
  };
  body.onchange = ev => { if (ev.target.id === 'rMode') { collect(); draw(); } };
  draw();
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act] || AUTH[el.dataset.act]; if (fn) fn(el, ev);
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { ui.filter.q = t.value; $('#explist').innerHTML = expList(); }
  if (t.id === 'splitR') { const v = Number(t.value); $('#splitA').textContent = `${uname('u1')} ${v}%`; $('#splitB').textContent = `${uname('u2')} ${100 - v}%`; }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.f) { ui.filter[t.dataset.f] = t.value; $('#explist').innerHTML = expList(); }
  if (t.dataset.bud) { const b = { ...S.budgets }; const v = num(t.value); if (v > 0) b[t.dataset.bud] = v; else delete b[t.dataset.bud]; setSetting('budgets', b); toast('Budget saved'); }
  if (t.dataset.k && t.closest('[data-cat]')) { const id = t.closest('[data-cat]').dataset.cat; setSetting('categories', S.cats.map(c => c.id === id ? { ...c, [t.dataset.k]: t.value.trim() || c[t.dataset.k] } : c)); toast('Saved'); }
  if (t.id === 'splitR') { setSetting('defaultSplit', Number(t.value)); toast('Default split saved'); }
  if (t.id === 'remind') { setSetting('reminderDays', Math.min(15, Math.max(1, Math.round(num(t.value)) || 3))); toast('Saved'); }
  if (t.id === 'gCid') { const v = t.value.trim(); if (v && !/^[\w.-]+\.apps\.googleusercontent\.com$/.test(v)) return toast('That does not look like a client ID (it ends in .apps.googleusercontent.com)'); setSetting('googleClientId', v); toast(v ? 'Client ID saved' : 'Google sign-in turned off'); render(); }
  if (t.id === 'cur') { setSetting('currency', t.value.trim() || '₹'); toast('Saved'); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') return closeSheet();
  if (!session || $('#sheet').innerHTML || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === 'n') { ev.preventDefault(); openExpense(); }
  if (ev.key === '/') { ev.preventDefault(); go('expenses'); setTimeout(() => { const q = $('#q'); q && q.focus(); }, 50); }
});

/* ───────────────────────── sign-in & setup ───────────────────────── */
const LOGO = '<img class="logo" src="icon-192.png" alt="">';
let authSel = null, authInfo = null;
function authShell(html) {
  document.body.classList.add('auth');
  $('#topbar').innerHTML = '<h1>Tandem</h1>';
  $('#view').innerHTML = html;
}
function showSetup(err) {
  authShell(`${LOGO}<h2 class="center" style="font-size:24px">Expenses for two</h2><p class="center muted" style="margin:6px 0 22px">Log it in seconds. Split it fairly. Everything lives in your own Google Sheet.</p>
    <div class="card"><h3>Connect your sheet</h3><label class="f"><span>Backend URL</span><input class="in" id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(cfg.api || '')}" autocapitalize="off" autocomplete="off"></label>
    ${err ? `<p class="neg" style="margin-bottom:10px">${esc(err)}</p>` : ''}<button class="btn primary block" data-act="connect">Connect</button>
    <p class="hint">The URL you get after deploying the Apps Script (see SETUP.md). Your partner can just open the setup link you send from Settings.</p></div>
    <button class="btn block" data-act="demo">Try the demo with sample data</button>`);
}
async function showLogin() {
  authShell(`${LOGO}<p class="center muted">Connecting…</p>`);
  try { authInfo = await api('status'); }
  catch (e) { return showSetup(navigator.onLine ? e.message : 'You are offline. Connect to the internet to sign in.'); }
  if (authSel == null && authInfo.users.length) authSel = (store.get(K.prefs, {}).lastUser && authInfo.users.some(u => u.id === prefs.lastUser)) ? prefs.lastUser : authInfo.users[0].id;
  if (!authInfo.users.length) authSel = 'new';
  drawLogin();
}
function loadGsi() {
  if (window.google && google.accounts && google.accounts.id) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = () => res(); s.onerror = () => rej(new Error('Could not load Google sign-in')); document.head.appendChild(s); });
}
function googleButton(el, clientId, callback) {
  if (!el || !clientId) return;
  loadGsi().then(() => { if (!el.isConnected) return; google.accounts.id.initialize({ client_id: clientId, callback, ux_mode: 'popup' }); google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', shape: 'pill', text: 'continue_with', width: 280 }); })
    .catch(() => { if (el.isConnected) el.innerHTML = '<span class="hint">Google sign-in could not load. Check your connection.</span>'; });
}
function finishLogin(r) {
  session = { token: r.token, userId: r.userId }; store.set(K.session, session);
  prefs.lastUser = r.userId; savePrefs();
  state = blank(); queue = []; saveQueue(); meta = {}; store.set(K.meta, meta);
  startApp();
}
async function onGoogleLogin(resp) {
  try { finishLogin(await api('googleLogin', { credential: resp.credential })); }
  catch (e) {
    if (e.code !== 'canregister' || !confirm(e.message + '\n\nCreate a new Tandem account with it?')) return drawLogin(e.message);
    try { finishLogin(await api('googleLogin', { credential: resp.credential, register: true })); } catch (e2) { drawLogin(e2.message); }
  }
}
function mountGoogleLink() {
  googleButton($('#gLink'), state.settings.googleClientId, async resp => {
    try { const r = await api('linkGoogle', { token: session.token, credential: resp.credential }); const u = state.users.find(x => x.id === meId()); if (u) u.googleEmail = r.googleEmail; saveState(); render(); toast('Google account linked'); }
    catch (e) { toast(e.message); }
  });
}
function drawLogin(err) {
  const us = authInfo.users, isNew = authSel === 'new';
  authShell(`${LOGO}<h2 class="center" style="font-size:22px">${us.length ? "Who's this?" : 'Create the first account'}</h2>
    <div class="profiles">${us.map(u => `<button class="profile ${authSel === u.id ? 'on' : ''}" data-act="pick" data-id="${esc(u.id)}"><span class="avatar" style="background:${esc(u.color || USER_COLORS[u.id])}">${esc((u.name[0] || '?').toUpperCase())}</span>${esc(u.name)}</button>`).join('')}
      ${authInfo.canRegister && us.length ? `<button class="profile ${isNew ? 'on' : ''}" data-act="pick" data-id="new"><span class="avatar" style="background:var(--surface2);color:var(--ink)">+</span>New account</button>` : ''}</div>
    ${authInfo.googleClientId ? '<div id="gBtn" style="display:flex;justify-content:center;min-height:44px;margin-bottom:6px"></div><p class="center muted" style="margin-bottom:10px">or use your password</p>' : ''}
    <form class="card" id="authForm">
      ${isNew ? '<label class="f"><span>Your name</span><input class="in" id="aName" maxlength="40" autocomplete="name"></label><label class="f"><span>Email (optional, for card reminders)</span><input class="in" id="aEmail" type="email" autocomplete="email"></label>' : ''}
      <label class="f"><span>${isNew ? 'Choose a password (6+ characters)' : 'Password'}</span><input class="in" id="aPw" type="password" autocomplete="${isNew ? 'new-password' : 'current-password'}"></label>
      ${err ? `<p class="neg" style="margin-bottom:10px">${esc(err)}</p>` : ''}
      <button class="btn primary block" id="authBtn">${isNew ? 'Create account' : 'Sign in'}</button>${isNew ? '' : '<button type="button" class="btn block" data-act="forgot" style="margin-top:8px">Forgot password?</button>'}</form>
    <button class="btn block" data-act="changeApi">Use a different sheet</button>`);
  $('#authForm').onsubmit = async ev => {
    ev.preventDefault();
    const btn = $('#authBtn'); btn.disabled = true; btn.textContent = 'Please wait…';
    try {
      const r = isNew ? await api('register', { name: $('#aName').value, email: $('#aEmail').value, password: $('#aPw').value }) : await api('login', { userId: authSel, password: $('#aPw').value });
      finishLogin(r);
    } catch (e) { drawLogin(e.message); }
  };
  googleButton($('#gBtn'), authInfo.googleClientId, onGoogleLogin);
  const first = $(isNew ? '#aName' : '#aPw'); first && first.focus();
}
function drawReset(sentTo, err) {
  authShell(`${LOGO}<h2 class="center" style="font-size:22px">Reset password</h2><p class="center muted" style="margin:6px 0 16px">A 6-digit code was emailed to ${esc(sentTo)}. It works for 15 minutes.</p>
    <form class="card" id="rstForm"><label class="f"><span>Code from the email</span><input class="in" id="rCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>
      <label class="f"><span>New password (6+ characters)</span><input class="in" id="rPw" type="password" autocomplete="new-password"></label>
      ${err ? `<p class="neg" style="margin-bottom:10px">${esc(err)}</p>` : ''}<button class="btn primary block">Set new password</button></form>
    <button class="btn block" data-act="backLogin">Back to sign in</button>`);
  $('#rstForm').onsubmit = async ev => { ev.preventDefault(); try { finishLogin(await api('resetConfirm', { userId: authSel, code: $('#rCode').value.trim(), newPassword: $('#rPw').value })); } catch (e) { drawReset(sentTo, e.message); } };
  $('#rCode').focus();
}
const AUTH = {
  async forgot() { try { const r = await api('resetRequest', { userId: authSel }); drawReset(r.sentTo); } catch (e) { drawLogin(/Unknown action/.test(e.message) ? 'Update the backend script to use password reset.' : e.message); } },
  backLogin() { drawLogin(); },
  connect() {
    const url = $('#apiUrl').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)) return showSetup('That does not look like an Apps Script web app URL. It should start with https://script.google.com/ and end in /exec.');
    cfg = { api: url }; store.set(K.cfg, cfg); authSel = null; showLogin();
  },
  demo() { cfg = { demo: true }; store.set(K.cfg, cfg); seedDemo(); session = { userId: 'u1' }; store.set(K.session, session); startApp(); },
  pick(el) { authSel = el.dataset.id; drawLogin(); },
  changeApi() { cfg = {}; store.set(K.cfg, cfg); showSetup(); }
};

function seedDemo() {
  state = blank();
  state.users = [{ id: 'u1', name: 'Alex', email: '', color: USER_COLORS.u1 }, { id: 'u2', name: 'Sam', email: '', color: USER_COLORS.u2 }];
  state.cards = [{ id: 'k1', owner: 'u1', name: 'Rewards Card', last4: '4417', statementDay: 12, dueDay: 1, limit: 150000, deleted: false }, { id: 'k2', owner: 'u2', name: 'Travel Card', last4: '8820', statementDay: 20, dueDay: 8, limit: 100000, deleted: false }];
  state.settings = { budgets: { _total: 60000, groceries: 12000, dining: 8000 } };
  const items = [['Big Basket', 'groceries', 1850], ['Dinner out', 'dining', 1420], ['Uber', 'transport', 310], ['Petrol', 'fuel', 2000], ['Electricity bill', 'utilities', 2340], ['Movie night', 'entertainment', 780], ['Pharmacy', 'health', 460], ['Coffee', 'dining', 280], ['Vegetables', 'groceries', 420], ['Amazon', 'shopping', 2199], ['Cat food', 'pets', 1150], ['Swiggy', 'dining', 540]];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const modes = ['upi', 'upi', 'upi', 'credit_card', 'credit_card', 'cash', 'debit_card'];
  for (let i = 0; i < 70; i++) {
    const it = items[Math.floor(rnd() * items.length)], paidBy = rnd() < .55 ? 'u1' : 'u2', mode = modes[Math.floor(rnd() * modes.length)];
    const amount = Math.round(it[2] * (.6 + rnd() * .9)), splitType = rnd() < .75 ? 'shared' : 'personal';
    state.expenses.push({ id: 'd' + i, type: 'expense', date: addDays(today(), -Math.floor(rnd() * 150)), amount, description: it[0], category: it[1], paidBy, mode, cardId: mode === 'credit_card' ? (paidBy === 'u1' ? 'k1' : 'k2') : '', splitType, ...computeShares(amount, paidBy, splitType, 50), notes: '', recurringId: '', createdAt: Date.now() - i * 1000, deleted: false });
  }
  const old = state.expenses.filter(e => monthOf(e.date) < monthOf(today()));
  if (old.length) { old.forEach(e => (e.settledBy = 'ds1')); state.expenses.push({ id: 'ds1', type: 'settlement', date: dayOn(...today().split('-').map(Number).slice(0, 2), 1), amount: 1840, description: 'Settlement', category: '', paidBy: 'u2', mode: 'upi', cardId: '', splitType: '', share1: 0, share2: 0, notes: '', recurringId: '', settledBy: '', createdAt: Date.now(), deleted: false }); }
  state.accounts = [{ id: 'a1', owner: 'u1', name: 'HDFC Salary', upiApp: 'GPay', deleted: false }, { id: 'a2', owner: 'u1', name: 'ICICI Savings', upiApp: 'PhonePe', deleted: false }, { id: 'a3', owner: 'u2', name: 'SBI', upiApp: 'Paytm', deleted: false }];
  state.expenses.push({ id: 'di1', type: 'income', date: dayOn(...today().split('-').map(Number).slice(0, 2), 1), amount: 85000, description: 'Salary', category: 'salary', paidBy: 'u1', mode: '', cardId: '', accountId: 'a1', splitType: '', share1: 0, share2: 0, notes: '', recurringId: '', settledBy: '', createdBy: 'u1', createdAt: Date.now(), deleted: false });
  state.recurring = [{ id: 'r2', description: 'Office lunch', amount: 150, category: 'dining', paidBy: 'u1', mode: 'upi', cardId: '', accountId: 'a1', splitType: 'personal', payerPct: 50, dayOfMonth: 1, active: true, deleted: false, schedule: 'ask', days: '0,1,2,3,4,5,6', askTime: '00:00', startDate: today() }, { id: 'r1', description: 'Rent', amount: 24000, category: 'rent', paidBy: 'u1', mode: 'netbanking', cardId: '', splitType: 'shared', payerPct: 50, dayOfMonth: 1, active: true, deleted: false }];
  saveState();
}

/* ───────────────────────── boot ───────────────────────── */
function route() {
  const v = location.hash.replace(/^#\/?/, '');
  ui.view = VIEWS[v] ? v : 'home';
  if (session) { closeSheet(); render(); window.scrollTo(0, 0); }
  if (v.startsWith('ask/')) { const [, id, act] = v.split('/'); history.replaceState(null, '', location.pathname + '#/home'); if (session && act && act !== 'open') doAsk(id, act); }
  if (v === 'add') { history.replaceState(null, '', location.pathname + '#/home'); if (session) openExpense(); }
}
function startApp() {
  route();
  if (cfg.demo) { runRecurring(); render(); notifyCards(); } else sync();
}
function boot() {
  if (location.hash.startsWith('#api=')) {
    const url = decodeURIComponent(location.hash.slice(5));
    if (/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url) && url !== cfg.api) { cfg = { api: url }; store.set(K.cfg, cfg); session = null; store.del(K.session); }
    history.replaceState(null, '', location.pathname);
  }
  if (session && (cfg.api || cfg.demo)) return startApp();
  session = null;
  if (cfg.api) return showLogin();
  showSetup();
}
window.addEventListener('hashchange', route);
window.addEventListener('online', () => { setStatus(); sync(); });
window.addEventListener('offline', setStatus);
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (saveT) flushState(); return; } if (!session) return; tick(); if (Date.now() - lastSync > 30000) sync(); });
setInterval(tick, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', ev => { const d = ev.data || {}; if (d.ask && session) { go('home'); if (d.action && d.action !== 'open') doAsk(d.ask, d.action); } });
window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); installEvt = ev; if (session && ui.view === 'more') render(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('pagehide', () => { if (saveT) flushState(); });
loadState().then(boot);
})();
</script>
