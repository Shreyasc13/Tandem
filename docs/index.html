<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.split2{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface2);gap:2px}
.ccard{border-radius:16px;padding:16px;color:#fff;margin-bottom:10px;background:linear-gradient(135deg,#1f2937,#0f766e)}

.ccard .nm{font-weight:720;font-size:16px}.ccard small{opacity:.8}
.ccard .bar{background:rgba(255,255,255,.2);margin:10px 0 4px}.ccard .bar>i{background:#fff}

.ccard .st{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}

<script>
(() => {
'use strict';

/* ───────────────────────── helpers ───────────────────────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const toStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const dim = (y, m) => new Date(y, m, 0).getDate();

const dayLabel = s => { const t = today(); if (s === t) return 'Today'; if (s === addDays(t, -1)) return 'Yesterday'; return parseD(s).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }); };

];

const nf = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 });

/* ───────────────────────── normalise server data ───────────────────────── */

function norm(d) {

/* ───────────────────────── mutations + sync ───────────────────────── */
function applyLocal(op) {
  if (op.table === 'Settings') { try { state.settings[op.row.id] = JSON.parse(op.row.value); } catch {} return; }
  const key = TABLES[op.table]; if (!key) return;
  const i = state[key].findIndex(r => r.id === op.row.id);
  if (i >= 0) state[key][i] = { ...state[key][i], ...op.row }; else state[key].push({ ...op.row });
}
function mutate(table, row, quiet) {
  const op = { table, row: { ...row, updatedAt: Date.now() } };
  applyLocal(op);
  saveState();
  if (!cfg.demo) { queue.push(op); saveQueue(); scheduleSync(); }
  if (!quiet) render();
  setStatus();
}
function setSetting(key, val) { mutate('Settings', { id: key, value: JSON.stringify(val) }, true); }

async function api(action, payload = {}) {
  const r = await fetch(cfg.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...payload }), redirect: 'follow' });
  let j;
  try { j = await r.json(); } catch { throw new Error('Backend did not answer correctly. Check the URL and that access is set to "Anyone".'); }
  if (!j.ok) throw Object.assign(new Error(j.error || 'Something went wrong'), { code: j.code });
  return j;
}
function scheduleSync(ms = 500) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
async function sync() {
  if (cfg.demo || !cfg.api || !session) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setStatus();
  const sending = queue.slice();
  try {
    const res = await api('sync', { token: session.token, ops: sending });
    queue = queue.slice(sending.length); saveQueue();
    const had = new Set(state.expenses.map(e => e.id)), firstSync = !meta.synced;
    state = norm(res.data);
    if (res.data.sheetUrl) { meta.sheetUrl = res.data.sheetUrl; store.set(K.meta, meta); }
    queue.forEach(applyLocal);
    saveState(); lastSync = Date.now(); syncErr = null;
    runRecurring();
    render(true); notifyCards();
    const fresh = state.expenses.filter(e => !had.has(e.id) && !e.deleted && e.createdBy && e.createdBy !== meId());
    if (!meta.synced) { meta.synced = true; store.set(K.meta, meta); }
    if (!firstSync && fresh.length) toast(`${uname(otherId())} added ${fresh.length === 1 ? (fresh[0].type === 'settlement' ? 'a settlement' : '“' + fresh[0].description + '” ' + money(fresh[0].amount)) : fresh.length + ' entries'}`);
  } catch (err) {
    syncErr = err;
    if (err.code === 'auth') { session = null; store.del(K.session); toast('Please sign in again'); boot(); }
  } finally {
    syncing = false; setStatus();
    if (syncAgain) { syncAgain = false; scheduleSync(100); }
  }
}
function setStatus() {
  const el = $('#sync'); if (!el) return;
  const pending = queue.length;
  let cls = '', txt = 'Synced';
  if (cfg.demo) txt = 'Demo';
  else if (syncing) { cls = 'busy pending'; txt = 'Syncing'; }
  else if (!navigator.onLine) { cls = 'pending'; txt = pending ? `Offline · ${pending}` : 'Offline'; }
  else if (syncErr) { cls = 'err'; txt = pending ? `Retry · ${pending}` : 'Retry'; }
  else if (pending) { cls = 'pending'; txt = `${pending} pending`; }
  el.className = 'sync ' + cls; el.lastChild.textContent = txt;
  el.title = syncErr ? syncErr.message : '';
}

/* ───────────────────────── money logic ───────────────────────── */
function computeShares(amount, paidBy, splitType, payerPct) {
  let pct1;
  if (splitType === 'personal') pct1 = paidBy === 'u1' ? 100 : 0;
  else if (splitType === 'other') pct1 = paidBy === 'u1' ? 0 : 100;
  else if (splitType === 'custom') pct1 = paidBy === 'u1' ? payerPct : 100 - payerPct;
  else pct1 = S.split;
  const share1 = round2(amount * pct1 / 100);
  return { share1, share2: round2(amount - share1) };
}
/** Positive: partner owes me. Negative: I owe partner. */
const lentOf = e => (e.paidBy === meId() ? shareOf(e, otherId()) : -shareOf(e, meId()));
/** Shared expenses that no settlement has closed yet. The balance is simply their sum. */
const openItems = () => spends().filter(e => !e.settledBy && lentOf(e) !== 0);
function balance() { return round2(openItems().reduce((s, e) => s + lentOf(e), 0)); }
function stats(ym, basis = 'all') {
  const me = meId(), list = spends().filter(e => monthOf(e.date) === ym);
  const val = e => (basis === 'mine' ? shareOf(e, me) : spendOf(e));
  const r = { list, total: 0, mine: 0, theirs: 0, paidMe: 0, paidOther: 0, sum: 0, byCat: {}, byDay: {}, byMode: {}, byPlat: {} };
  for (const e of list) {
    r.total += spendOf(e); r.mine += shareOf(e, me); r.theirs += shareOf(e, otherId());
    if (e.paidBy === me) r.paidMe += e.amount; else r.paidOther += e.amount;
    const v = val(e); if (!v) continue;
    r.sum += v;
    if ((e.cats || []).length > 1 && e.amount) e.cats.forEach(c => (r.byCat[c.id] = (r.byCat[c.id] || 0) + v * c.amount / e.amount));   // mixed order
    else r.byCat[e.category] = (r.byCat[e.category] || 0) + v;
    if (e.platform) r.byPlat[e.platform] = (r.byPlat[e.platform] || 0) + v;
    r.byDay[e.date] = (r.byDay[e.date] || 0) + v;
    r.byMode[e.mode] = (r.byMode[e.mode] || 0) + v;
  }
  return r;
}

/* credit-card cycles */
const dayOn = (y, m, d) => `${y}-${pad(m)}-${pad(Math.min(d, dim(y, m)))}`;
function shiftCycle(s, day, n) { let [y, m] = s.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return dayOn(y, m, day); }
function lastStmt(t, Sd) { const [y, m] = t.split('-').map(Number); const s = dayOn(y, m, Sd); return s <= t ? s : shiftCycle(s, Sd, -1); }
function dueFor(stmt, D) { const [y, m] = stmt.split('-').map(Number); const d = dayOn(y, m, D); return d > stmt ? d : shiftCycle(stmt, D, 1); }
function cardInfo(c) {
  const t = today(), ls = lastStmt(t, c.statementDay), ps = shiftCycle(ls, c.statementDay, -1), ns = shiftCycle(ls, c.statementDay, 1);
  let billed = 0, unbilled = 0;
  for (const e of spends()) { if (e.cardId !== c.id) continue; if (e.date > ps && e.date <= ls) billed += e.amount; else if (e.date > ls) unbilled += e.amount; }
  const due = dueFor(ls, c.dueDay);
  const paid = state.billPayments.some(p => p.id === c.id + '_' + ls && !p.deleted);
  return { stmt: ls, next: ns, due, billed: round2(billed), unbilled: round2(unbilled), paid, daysToDue: diffDays(due, t), daysSince: diffDays(t, ls) };
}
function cardAlerts() {
  const out = [];
  for (const c of liveCards()) {
    const i = cardInfo(c); if (i.billed <= 0 || i.paid) continue;
    const label = `${c.name}${c.last4 ? ' ••' + c.last4 : ''}`;
    if (i.daysToDue < 0) out.push({ c, i, type: 'overdue', cls: 'bad', icon: '🚨', title: `${label} bill overdue`, text: `${money(i.billed)} was due ${niceDate(i.due)}` });
    else if (i.daysToDue <= S.remind) out.push({ c, i, type: 'due', cls: '', icon: '⏰', title: `${label} due ${i.daysToDue === 0 ? 'today' : i.daysToDue === 1 ? 'tomorrow' : 'in ' + i.daysToDue + ' days'}`, text: `${money(i.billed)} · pay by ${niceDate(i.due)}` });
    else if (i.daysSince <= 3) out.push({ c, i, type: 'generated', cls: 'info', icon: '🧾', title: `${label} bill generated`, text: `${money(i.billed)} · pay by ${niceDate(i.due)}` });
  }
  return out;
}
async function notifyCards() {
  if (!session || !('Notification' in window) || Notification.permission !== 'granted') return;
  const seen = store.get(K.notified, {}), t = today(); let changed = false;
  for (const a of cardAlerts()) {
    if (a.c.owner !== meId()) continue;
    const key = `${a.c.id}|${a.i.stmt}|${a.type}`;
    if (seen[key] === t) continue;
    seen[key] = t; changed = true;
    try {
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg) reg.showNotification(a.title, { body: a.text, icon: 'icon-192.png', badge: 'icon-192.png', tag: key });
      else new Notification(a.title, { body: a.text, icon: 'icon-192.png' });
    } catch {}
  }
  if (changed) store.set(K.notified, seen);
}

/* recurring: deterministic ids make this safe on both devices */
function runRecurring() {
  const t = today(), ym = monthOf(t), [y, m, d] = t.split('-').map(Number);
  let made = 0;
  for (const r of state.recurring) {
    if (r.deleted || !r.active || !r.amount) continue;
    const day = Math.min(r.dayOfMonth, dim(y, m));
    if (d < day) continue;
    const id = `rec_${r.id}_${ym}`;
    if (state.expenses.some(e => e.id === id)) continue;
    const sh = computeShares(r.amount, r.paidBy, r.splitType, r.payerPct);
    mutate('Expenses', { id, type: 'expense', date: dayOn(y, m, day), amount: r.amount, description: r.description, category: r.category, paidBy: r.paidBy, mode: r.mode, cardId: r.cardId, splitType: r.splitType, ...sh, notes: 'Auto-added (recurring)', recurringId: r.id, createdAt: Date.now(), deleted: false }, true);
    made++;
  }
  if (made) toast(`${made} recurring expense${made > 1 ? 's' : ''} added`);
}

function quickList() {
  const since = addDays(today(), -120), m = {};
  for (const e of spends()) { if (e.date < since || e.recurringId) continue; const k = e.description.toLowerCase(); (m[k] = m[k] || { n: 0, e }).n++; if (e.createdAt > m[k].e.createdAt) m[k].e = e; }

function upcoming() {

  }
  for (const c of liveCards()) {
    const i = cardInfo(c);
    if (i.next <= lim && i.unbilled > 0) out.push({ date: i.next, icon: '🧾', title: `${c.name} bill generates`, sub: you(c.owner), amt: i.unbilled });
    if (i.billed > 0 && !i.paid && i.daysToDue > S.remind && i.due <= lim) out.push({ date: i.due, icon: '💳', title: `${c.name} payment due`, sub: you(c.owner), amt: i.billed });
  }

};

function expFiltered() {
  const f = ui.filter, me = meId(), q = f.q.trim().toLowerCase();
  let list = live().filter(e => q ? true : monthOf(e.date) === ui.month);
  return list.filter(e => {
    if (q && !(e.description + ' ' + e.notes + ' ' + cat(e.category).name + ' ' + (e.platform || '') + ' ' + (e.platform && e.device === 'office' ? 'office' : '')).toLowerCase().includes(q)) return false;
    if (f.cat && e.category !== f.cat && !(e.cats || []).some(c => c.id === f.cat)) return false;
    if (f.plat && e.platform !== f.plat) return false;
    if (f.mode && e.mode !== f.mode) return false;
    if (f.who === 'me' && e.paidBy !== me) return false;
    if (f.who === 'other' && e.paidBy === me) return false;
    const personal = e.type !== 'settlement' && shareOf(e, other(e.paidBy)) === 0;
    if (f.who === 'shared' && (personal || e.type === 'settlement')) return false;
    if (f.who === 'personal' && !personal) return false;
    if (f.who === 'friends' && !e.friendsShare) return false;
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
}
function expList() {
  const list = expFiltered(), q = ui.filter.q.trim();
  if (!list.length) return `<div class="empty"><b>🔍</b>${q ? 'No matches.' : 'Nothing here for ' + esc(monthName(ui.month)) + '.'}</div>`;
  const total = list.filter(e => e.type !== 'settlement').reduce((s, e) => s + e.amount, 0);
  let html = `<p class="hint">${list.length} entr${list.length === 1 ? 'y' : 'ies'} · ${money(total)}${q ? ' · all months' : ''}</p><div class="card" style="padding-top:2px">`, cur = '';
  const dayTot = {};
  list.forEach(e => { if (e.type !== 'settlement') dayTot[e.date] = (dayTot[e.date] || 0) + e.amount; });
  list.slice(0, 400).forEach(e => {
    if (e.date !== cur) { cur = e.date; html += `<div class="dayhead"><span>${esc(dayLabel(e.date))}</span><span>${dayTot[e.date] ? money(dayTot[e.date]) : ''}</span></div>`; }
    html += expRow(e);
  });
  return html + '</div>';
}

/* ───────────────────────── expense form ───────────────────────── */
function openExpense(existing, preset) {
  const me = meId();
  const f = existing ? { ...existing } : { id: uid(), type: 'expense', date: today(), amount: '', description: '', category: '', paidBy: me, mode: prefs.lastMode || 'upi', cardId: '', splitType: prefs.lastSplit || 'shared', notes: '', ...preset };
  f.payerPct = 50; f.cm = prefs.lastCustom || 'items'; f.own1 = ''; f.own2 = ''; f.ex1 = '';
  if (existing && existing.splitType === 'custom') { f.cm = 'amounts'; f.ex1 = existing.share1; }
  f.platform = f.platform || ''; f.device = f.device || 'primary';
  f.mixed = !!(existing && (existing.cats || []).length > 1);
  f.parts = f.mixed ? existing.cats.map(c => ({ id: c.id, amount: c.amount })) : [];
  f.fr = {}; f.frMode = existing ? 'amounts' : (preset && preset.frMode) || 'equal';
  if (existing) (existing.friends || []).forEach(p => (f.fr[p.id] = p.amount)); else if (preset && preset.fr) f.fr = { ...preset.fr };
  const base0 = existing ? round2(existing.amount - (existing.friendsShare || 0)) : 0;
  if (existing && base0) {
    f.payerPct = Math.round(shareOf(existing, existing.paidBy) / base0 * 1000) / 10;
    const d = computeShares(base0, existing.paidBy, existing.splitType, f.payerPct);
    if (existing.splitType === 'shared' && Math.abs(d.share1 - existing.share1) > 0.01) { f.splitType = 'custom'; f.cm = 'amounts'; f.ex1 = existing.share1; }
  }
  /* reopen a custom split the way it was entered */
  const si = existing && existing.splitType === 'custom' ? existing.splitInfo || {} : {};
  if (si.cm === 'items') { f.cm = 'items'; f.own1 = si.own1 || ''; f.own2 = si.own2 || ''; }
  else if (si.cm === 'pct' && isFinite(Number(si.pct))) { f.cm = 'pct'; f.payerPct = Number(si.pct); }
  if (!existing && f.mode === 'credit_card') f.cardId = prefs.lastCard || '';
  const locked = !!(existing && existing.settledBy), touched = new Set(Object.keys(preset || {}));
  /* the form stays short: sections are one-line rows until tapped */
  const open = new Set(); let allCats = false, platQ = false;
  if (f.splitType === 'custom') open.add('split');
  if (Object.keys(f.fr).length) open.add('friends');
  const since = addDays(today(), -120), catUse = {}, platUse = {};
  spends().forEach(e => { if (e.date < since) return; catUse[e.category] = (catUse[e.category] || 0) + 1; if (e.platform) platUse[e.platform] = (platUse[e.platform] || 0) + 1; });
  const catRank = S.activeCats.slice().sort((a, b) => (catUse[b.id] || 0) - (catUse[a.id] || 0));
  const platAll = () => [...new Set([...Object.keys(platUse).sort((a, b) => platUse[b] - platUse[a]), ...S.platforms])];
  const body = openSheet(existing ? 'Edit expense' : 'Add expense', '');

  const collect = () => {
    const g = id => $('#' + id, body);
    if (!g('fAmt')) return;
    f.amount = g('fAmt').value; f.description = g('fDesc').value;
    if (g('fNotes')) f.notes = g('fNotes').value;
    if (g('fDate') && g('fDate').value) f.date = g('fDate').value;
    if (g('fPct')) f.payerPct = Math.min(100, Math.max(0, num(g('fPct').value)));
    if (g('fOwn1')) { f.own1 = g('fOwn1').value; f.own2 = g('fOwn2').value; }
    if (g('fEx1')) f.ex1 = g('fEx1').value;
    $$('[data-frid]', body).forEach(i => (f.fr[i.dataset.frid] = i.value));
    $$('[data-mcat]', body).forEach(i => { if (f.parts[i.dataset.mcat]) f.parts[i.dataset.mcat].id = i.value; });
    $$('[data-mamt]', body).forEach(i => { if (f.parts[i.dataset.mamt]) f.parts[i.dataset.mamt].amount = i.value; });
  };
  /* mixed order: any categories, each with its amount; anything left unassigned goes to the first one */
  const catAlloc = (a = calc(f.amount)) => {
    const m = new Map();
    if (f.mixed) f.parts.forEach(p => { if (p.id) m.set(p.id, round2((m.get(p.id) || 0) + Math.max(0, calc(p.amount)))); });
    const list = [...m].map(([id, amount]) => ({ id, amount })), left = round2(a - list.reduce((s, c) => s + c.amount, 0));
    if (list.length && left > 0) list[0].amount = round2(list[0].amount + left);
    return { list: list.length > 1 ? list : [], left, n: list.length };
  };
  /* friends' parts come off the top; the two of you split what is left */
  const frAlloc = (a = calc(f.amount)) => {
    const ids = Object.keys(f.fr); if (!ids.length) return [];
    if (f.frMode === 'equal') { const each = round2(a / (ids.length + (/personal|other/.test(f.splitType) ? 1 : 2))); return ids.map(id => ({ id, amount: each })); }
    return ids.map(id => ({ id, amount: round2(Math.max(0, calc(f.fr[id]))) }));
  };
  const frTotal = a => round2(frAlloc(a).reduce((s, p) => s + p.amount, 0));
  const base = () => round2(Math.max(0, calc(f.amount) - frTotal()));
  /* uneven splits: by items (each person's own items + shared rest), exact amounts, or percent */
  const shares = (a = base()) => {
    if (f.splitType !== 'custom' || f.cm === 'pct') return computeShares(a, f.paidBy, f.splitType, f.payerPct);
    if (f.cm === 'amounts') { const s1 = round2(Math.min(a, Math.max(0, num(f.ex1)))); return { share1: s1, share2: round2(a - s1) }; }
    const o1 = Math.max(0, num(f.own1)), o2 = Math.max(0, num(f.own2)), rest = Math.max(0, a - o1 - o2);
    const s1 = round2(Math.min(a, o1 + rest * S.split / 100)); return { share1: s1, share2: round2(a - s1) };
  };
  if (si.cm && si.cm !== 'amounts' && Math.abs(shares(base0).share1 - existing.share1) > 0.01) { f.cm = 'amounts'; f.ex1 = existing.share1; }   // edited elsewhere: trust the saved shares
  const splitDetail = () => f.splitType !== 'custom' ? '' : f.cm === 'items' ? `By items: only ${youL('u1')} ${money(num(f.own1))}, only ${youL('u2')} ${money(num(f.own2))}, rest shared ${S.split}/${100 - S.split}` : f.cm === 'pct' ? `By percent: ${youL(f.paidBy)} ${f.payerPct}%, ${youL(other(f.paidBy))} ${round2(100 - f.payerPct)}%` : 'Exact amounts';
  const summary = () => {
    const a = calc(f.amount), sh = shares(), o = other(f.paidBy), owed = shareOf(sh, o);
    if (!a) return '';
    if (!owed) return Object.keys(f.fr).length ? 'Nothing to split between the two of you' : `${you(f.paidBy)} cover${f.paidBy === me ? '' : 's'} all of it — nothing to split`;
    return `${you(o)} owe${o === me ? '' : 's'} ${youL(f.paidBy)} <b>${money(owed)}</b> · ${youL(f.paidBy)} ${f.paidBy === me ? 'keep' : 'keeps'} ${money(shareOf(sh, f.paidBy))}${f.splitType === 'custom' ? '<br>' + esc(splitDetail()) : ''}`;
  };
  const sec = (key, label, value, content) => open.has(key)
    ? `<div class="fsec"><button type="button" class="flabel shut" data-close="${key}">${label} ▴</button>${content}</div>`
    : `<button type="button" class="crow" data-open="${key}"><span>${label}</span><b>${value}</b><i>›</i></button>`;
  const platResults = q => {
    const all = platAll(), ql = q.trim().toLowerCase(), hits = all.filter(n => n.toLowerCase().includes(ql)).slice(0, 8);
    return hits.map(n => chip(f.platform === n, `data-plat="${esc(n)}"`, esc(n))).join('') + (ql && !all.some(n => n.toLowerCase() === ql) ? `<button type="button" class="chip on" data-platnew="1">+ Add “${esc(q.trim())}”</button>` : '') || '<span class="hint">Type a name to add it.</span>';
  };
  const draw = () => {
    const sp = S.split, o = other(f.paidBy), t = today();
    const myCards = liveCards().filter(c => c.owner === f.paidBy);
    if (f.mode === 'credit_card' && !myCards.some(c => c.id === f.cardId)) f.cardId = myCards.length === 1 ? myCards[0].id : (myCards.find(c => c.id === prefs.lastCard) || {}).id || '';
    if (f.mode !== 'credit_card') f.cardId = '';

    const stl = locked && state.expenses.find(x => x.id === existing.settledBy);

    const shownPl = [...new Set([f.platform, ...platAll()].filter(Boolean))].slice(0, 4);
    const card = myCards.find(c => c.id === f.cardId), frIds = Object.keys(f.fr);
    const splitName = { shared: `Shared ${sp}/${100 - sp}`, personal: `Just ${youL(f.paidBy)}`, other: `All ${youL(o)}${o === me ? 'rs' : "'s"}`, custom: 'Custom' }[f.splitType] || 'Shared';

      <div class="amount"><span>${esc(S.cur)}</span><input id="fAmt" inputmode="decimal" placeholder="0" value="${esc(f.amount)}" autocomplete="off" ${locked ? 'readonly' : ''}>${locked ? '' : '<button type="button" class="plus" data-plus="1" aria-label="Add another amount">+</button>'}</div><p class="hint" id="fCalc" style="margin:-10px 0 12px"></p>

function openSettle(preIds) {
  const me = meId(), ot = otherId();
  const items = openItems().sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  if (!items.length) return toast('Nothing to settle');
  const sel = new Set(preIds || items.map(e => e.id));
  const f = { mode: 'upi' };
  const months = [...new Set(items.map(e => monthOf(e.date)))];
  const inMonth = ym => items.filter(e => monthOf(e.date) === ym);
  const sum = list => round2(list.reduce((s, e) => s + lentOf(e), 0));
  const signed = v => `<b class="${v > 0 ? 'pos' : 'neg'}">${v > 0 ? '+' : '−'}${money(Math.abs(v))}</b>`;
  const body = openSheet('Settle up', `
    <div class="card hero" style="margin-bottom:10px"><h3 id="stHead"></h3><div class="big" id="stAmt"></div><div class="sub" id="stSub"></div></div>
    <div class="chips" style="margin-bottom:4px">${chip(false, 'data-pick="all"', 'Everything')}${months.slice(0, 5).map(m => chip(false, `data-pick="${m}"`, 'Only ' + esc(monthShort(m)))).join('')}${chip(false, 'data-pick="none"', 'Clear')}</div>
    <p class="hint" style="margin-bottom:2px">Tick what this payment covers. <span class="pos">+</span> is owed to you, <span class="neg">−</span> is what you owe.</p>
    ${months.map(m => `<button type="button" class="dayhead mhead" data-pick="${m}" style="width:100%"><span>${esc(monthName(m))}</span><span>${money(sum(inMonth(m)))}</span></button><div class="list">${inMonth(m).map(e => `<button type="button" class="row srow" data-tog="${esc(e.id)}"><span class="chk"></span><span class="rmain"><b>${esc(e.description)}</b><small>${niceDate(e.date)} · ${esc(you(e.paidBy))} paid ${money(e.amount)}</small></span><span class="ramt">${signed(lentOf(e))}</span></button>`).join('')}</div>`).join('')}
    <div class="stick"><div class="chips" style="margin-bottom:10px">${[MODES[0], MODES[3], MODES[4]].map(m => chip(m[0] === f.mode, `data-mode="${m[0]}"`, m[2] + ' ' + m[1])).join('')}</div>
    <button class="btn primary block" data-save="1" id="stBtn"></button></div>`);
  const chosen = () => items.filter(e => sel.has(e.id));
  const refresh = () => {
    const c = chosen(), n = sum(c);
    $$('[data-tog]', body).forEach(r => r.classList.toggle('on', sel.has(r.dataset.tog)));
    $$('[data-mode]', body).forEach(r => r.classList.toggle('on', r.dataset.mode === f.mode));
    $('#stHead', body).textContent = !c.length ? 'Nothing selected' : Math.abs(n) < 0.005 ? 'These cancel out' : n > 0 ? `${uname(ot)} pays you` : `You pay ${uname(ot)}`;
    $('#stAmt', body).textContent = money(Math.abs(n));
    const mine = round2(c.filter(e => lentOf(e) > 0).reduce((s, e) => s + lentOf(e), 0)), theirs = round2(-c.filter(e => lentOf(e) < 0).reduce((s, e) => s + lentOf(e), 0));
    $('#stSub', body).textContent = `${c.length} of ${items.length} open expenses · you covered ${money(mine)} for ${uname(ot)}, ${uname(ot)} covered ${money(theirs)} for you`;
    const btn = $('#stBtn', body); btn.disabled = !c.length;
    btn.textContent = !c.length ? 'Select expenses' : Math.abs(n) < 0.005 ? `Mark ${c.length} as settled — nothing to pay` : `Record ${money(Math.abs(n))} · settles ${c.length} expense${c.length > 1 ? 's' : ''}`;
  };
  body.onclick = ev => {
    const t = ev.target.closest('[data-tog]');
    if (t) { sel.has(t.dataset.tog) ? sel.delete(t.dataset.tog) : sel.add(t.dataset.tog); return refresh(); }

    if (p) { const k = p.dataset.pick; sel.clear(); if (k === 'all') items.forEach(e => sel.add(e.id)); else if (k !== 'none') inMonth(k).forEach(e => sel.add(e.id)); return refresh(); }

    if (ev.target.closest('[data-save]')) {
      const c = chosen(); if (!c.length) return;
      const n = sum(c), sid = 's' + uid();
      mutate('Expenses', { id: sid, type: 'settlement', date: today(), amount: Math.abs(n), description: 'Settlement', category: '', paidBy: n > 0 ? ot : me, mode: f.mode, cardId: '', splitType: '', share1: 0, share2: 0, notes: `${c.length} expenses`, recurringId: '', settledBy: '', createdAt: Date.now(), deleted: false }, true);
      c.forEach(e => mutate('Expenses', { ...e, settledBy: sid }, true));
      closeSheet(); render(); toast(`Settled ${c.length} expense${c.length > 1 ? 's' : ''}`);
    }
  };
  refresh();
}

/* one friend: what they owe, tick what they have paid back, share a statement */
function friendStatement(id) {
  const d = friendDues().filter(x => x.id === id).sort((a, b) => a.e.date.localeCompare(b.e.date)); if (!d.length) return '';
  const tot = round2(d.reduce((s, x) => s + x.amount, 0)), by = {};
  d.forEach(x => (by[x.e.paidBy] = round2((by[x.e.paidBy] || 0) + x.amount)));
  return [`Hi ${friendName(id)}, here is what is pending:`, '', ...d.map(x => `• ${niceDate(x.e.date)} · ${x.e.description}: ${money(x.amount)} (your part of ${money(x.e.amount)}, paid by ${uname(x.e.paidBy)})`), '', `Total: ${money(tot)}`,
    ...Object.keys(by).map(u => `Pay ${uname(u)}: ${money(by[u])}`)].join('\n');
}
function openFriend(id) {

  const body = openSheet('Settlement', `

    <div class="list">${covered.map(e => { const v = lentOf(e); return `<div class="row"><span class="ico">${esc(cat(e.category).emoji)}</span><span class="rmain"><b>${esc(e.description)}</b><small>${niceDate(e.date)} · ${esc(you(e.paidBy))} paid ${money(e.amount)}</small></span><span class="ramt"><b class="${v > 0 ? 'pos' : 'neg'}">${v > 0 ? '+' : '−'}${money(Math.abs(v))}</b></span></div>`; }).join('')}</div>
    <button class="btn danger block" data-undo="1" style="margin-top:14px">Undo this settlement</button>

function openCard(c) {

  const days = sel => Array.from({ length: 31 }, (_, i) => `<option ${i + 1 === sel ? 'selected' : ''}>${i + 1}</option>`).join('');
  const draw = () => {
    body.innerHTML = `<label class="f"><span>Card name</span><input class="in" id="cName" value="${esc(f.name)}" placeholder="e.g. HDFC Regalia" maxlength="30"></label>
      <div class="fsec"><span class="flabel">Whose card</span><div class="seg">${['u1', 'u2'].map(id => `<button type="button" class="${f.owner === id ? 'on' : ''}" data-own="${id}">${esc(you(id))}</button>`).join('')}</div></div>
      <div class="grid2" style="grid-template-columns:1fr 1fr;margin-bottom:0"><label class="f"><span>Bill generated on</span><select class="in" id="cStmt">${days(f.statementDay)}</select></label><label class="f"><span>Payment due on</span><select class="in" id="cDue">${days(f.dueDay)}</select></label></div>
      <p class="hint" style="margin:-6px 0 14px">Day of the month, as shown on your statement. Do not enter the full card number anywhere.</p>
      <div class="grid2" style="grid-template-columns:1fr 1fr;margin-bottom:0"><label class="f"><span>Last 4 digits (optional)</span><input class="in" id="cL4" inputmode="numeric" maxlength="4" value="${esc(f.last4)}"></label><label class="f"><span>Credit limit (optional)</span><input class="in" id="cLim" inputmode="decimal" value="${esc(f.limit || '')}"></label></div>
      <button class="btn primary block" data-save="1">Save card</button>${c ? '<button class="btn danger block" data-del="1" style="margin-top:8px">Remove card</button>' : ''}`;

  body.onclick = ev => {

  };

function openRec(r) {

      <div class="fsec"><div class="seg"><button type="button" class="${f.active ? 'on' : ''}" data-set="active" data-val="1">Active</button><button type="button" class="${f.active ? '' : 'on'}" data-set="active" data-val="">Paused</button></div></div>
      <button class="btn primary block" data-save="1">Save</button>${r ? '<button class="btn danger block" data-del="1" style="margin-top:8px">Delete</button>' : ''}`;

  draw();

      Math.abs(bal) < 0.005 ? 'All settled up ✅' : `Still open: ${bal > 0 ? uname(ot) + ' owes ' + uname(me) : uname(me) + ' owes ' + uname(ot)} ${money(Math.abs(bal))}`].join('\n');
    try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); toast('Summary copied'); } } catch { try { await navigator.clipboard.writeText(text); toast('Summary copied'); } catch {} }
  },
  closeSheet,
  sheetBg: (el, ev) => { if (ev.target === el) closeSheet(); },
  syncNow: () => { if (cfg.demo) return toast('Demo mode — data stays on this device'); if (!navigator.onLine) return toast('You are offline — changes are saved and will sync'); sync().then(() => toast(syncErr ? syncErr.message : 'Synced')); },
  month: el => { ui.month = addMonth(ui.month, Number(el.dataset.n)); render(); },
  basis: el => { ui.basis = el.dataset.b; render(); },
  editCard: el => openCard(state.cards.find(c => c.id === el.dataset.id)),
  editRec: el => openRec(state.recurring.find(r => r.id === el.dataset.id)),
  markPaid: el => { const c = state.cards.find(x => x.id === el.dataset.id); if (!c) return; const i = cardInfo(c); mutate('BillPayments', { id: c.id + '_' + i.stmt, cardId: c.id, cycle: i.stmt, paidOn: today(), paidBy: meId(), deleted: false }); toast('Marked as paid'); },
  unmarkPaid: el => { const c = state.cards.find(x => x.id === el.dataset.id); if (!c) return; const i = cardInfo(c); mutate('BillPayments', { id: c.id + '_' + i.stmt, cardId: c.id, cycle: i.stmt, deleted: true }); },
  addPlat: () => { const n = (prompt('Platform name') || '').trim().slice(0, 24); if (n && !S.platforms.includes(n)) { setSetting('platforms', [...S.platforms, n]); render(); } },
  delPlat: el => { setSetting('platforms', S.platforms.filter(n => n !== el.dataset.n)); render(); },

    try { const r = await api('updateProfile', { token: session.token, name, email }); session.token = r.token; store.set(K.session, session); state = norm(r.data); queue.forEach(applyLocal); saveState(); render(); toast('Profile saved'); } catch (e) { toast(e.message); }
  },
  async changePw() {
    const o = $('#pwOld').value, n = $('#pwNew').value;
    if (n.length < 6) return toast('New password needs 6+ characters');
    try { const r = await api('updateProfile', { token: session.token, oldPassword: o, newPassword: n }); session.token = r.token; store.set(K.session, session); $('#pwOld').value = $('#pwNew').value = ''; toast('Password changed'); } catch (e) { toast(e.message); }
  },
  async testEmail() { toast('Sending…'); try { await api('testEmail', { token: session.token }); toast('Test email sent'); } catch (e) { toast(e.message); } },
  async askNotify() { if (!('Notification' in window)) return; const p = await Notification.requestPermission(); render(); if (p === 'granted') { toast('Notifications on'); notifyCards(); } },

  },
  switchUser() { session.userId = otherId(); store.set(K.session, session); render(); toast('Now using ' + uname(meId())); },
  logout() {
    if (queue.length && !confirm(`${queue.length} change(s) have not synced yet and will be lost. Sign out anyway?`)) return;
    session = null; store.del(K.session); queue = []; saveQueue(); state = blank(); saveState();
    if (cfg.demo) { cfg = {}; store.set(K.cfg, cfg); }
    location.hash = ''; boot();
  },
  resetDevice() { if (!confirm('Remove all Tandem data from this device? Your Google Sheet is not touched.')) return; Object.values(K).forEach(store.del); location.hash = ''; location.reload(); },
  install() { if (installEvt) { installEvt.prompt(); installEvt = null; } },
  exportCsv() {
    const head = ['date', 'description', 'category', 'amount', 'paid_by', 'mode', 'card', uname('u1') + '_share', uname('u2') + '_share', 'friends_share', 'friends', 'platform', 'ordered_from', 'category_split', 'added_by', 'type', 'settled', 'notes'];
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const rows = live().sort((a, b) => a.date.localeCompare(b.date)).map(e => [e.date, e.description, cat(e.category).name, e.amount, uname(e.paidBy), modeLabel(e.mode), (state.cards.find(c => c.id === e.cardId) || {}).name || '', e.share1, e.share2, e.friendsShare || 0, (e.friends || []).map(p => friendName(p.id) + ' ' + p.amount + (p.settled ? ' (paid)' : '')).join('; '), e.platform || '', e.platform ? DEVICES[e.device] || DEVICES.primary : '', (e.cats || []).map(c => cat(c.id).name + ' ' + c.amount).join('; '), e.createdBy ? uname(e.createdBy) : '', e.type, e.settledBy ? 'yes' : '', e.notes].map(q).join(','));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + head.map(q).join(',') + '\n' + rows.join('\n')], { type: 'text/csv' }));
    a.download = `tandem-expenses-${today()}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
};

document.addEventListener('keydown', ev => {

/* ───────────────────────── sign-in & setup ───────────────────────── */
const LOGO = '<img class="logo" src="icon-192.png" alt="">';
let authSel = null, authInfo = null;
function authShell(html) {
  document.body.classList.add('auth');
  $('#topbar').innerHTML = '<h1>Tandem</h1>';
  $('#view').innerHTML = html;
}
function showSetup(err) {
  authShell(`${LOGO}<h2 class="center" style="font-size:24px">Expenses for two</h2><p class="center muted" style="margin:6px 0 22px">Log it in seconds. Split it fairly. Everything lives in your own Google Sheet.</p>
    <div class="card"><h3>Connect your sheet</h3><label class="f"><span>Backend URL</span><input class="in" id="apiUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(cfg.api || '')}" autocapitalize="off" autocomplete="off"></label>
    ${err ? `<p class="neg" style="margin-bottom:10px">${esc(err)}</p>` : ''}<button class="btn primary block" data-act="connect">Connect</button>
    <p class="hint">The URL you get after deploying the Apps Script (see SETUP.md). Your partner can just open the setup link you send from Settings.</p></div>
    <button class="btn block" data-act="demo">Try the demo with sample data</button>`);
}
async function showLogin() {
  authShell(`${LOGO}<p class="center muted">Connecting…</p>`);
  try { authInfo = await api('status'); }
  catch (e) { return showSetup(navigator.onLine ? e.message : 'You are offline. Connect to the internet to sign in.'); }
  if (authSel == null && authInfo.users.length) authSel = (store.get(K.prefs, {}).lastUser && authInfo.users.some(u => u.id === prefs.lastUser)) ? prefs.lastUser : authInfo.users[0].id;
  if (!authInfo.users.length) authSel = 'new';
  drawLogin();
}
function drawLogin(err) {
  const us = authInfo.users, isNew = authSel === 'new';
  authShell(`${LOGO}<h2 class="center" style="font-size:22px">${us.length ? "Who's this?" : 'Create the first account'}</h2>
    <div class="profiles">${us.map(u => `<button class="profile ${authSel === u.id ? 'on' : ''}" data-act="pick" data-id="${esc(u.id)}"><span class="avatar" style="background:${esc(u.color || USER_COLORS[u.id])}">${esc((u.name[0] || '?').toUpperCase())}</span>${esc(u.name)}</button>`).join('')}
      ${authInfo.canRegister && us.length ? `<button class="profile ${isNew ? 'on' : ''}" data-act="pick" data-id="new"><span class="avatar" style="background:var(--surface2);color:var(--ink)">+</span>New account</button>` : ''}</div>
    <form class="card" id="authForm">
      ${isNew ? '<label class="f"><span>Your name</span><input class="in" id="aName" maxlength="40" autocomplete="name"></label><label class="f"><span>Email (optional, for card reminders)</span><input class="in" id="aEmail" type="email" autocomplete="email"></label>' : ''}
      <label class="f"><span>${isNew ? 'Choose a password (6+ characters)' : 'Password'}</span><input class="in" id="aPw" type="password" autocomplete="${isNew ? 'new-password' : 'current-password'}"></label>
      ${err ? `<p class="neg" style="margin-bottom:10px">${esc(err)}</p>` : ''}
      <button class="btn primary block" id="authBtn">${isNew ? 'Create account' : 'Sign in'}</button></form>
    <button class="btn block" data-act="changeApi">Use a different sheet</button>`);
  $('#authForm').onsubmit = async ev => {
    ev.preventDefault();
    const btn = $('#authBtn'); btn.disabled = true; btn.textContent = 'Please wait…';
    try {
      const r = isNew ? await api('register', { name: $('#aName').value, email: $('#aEmail').value, password: $('#aPw').value }) : await api('login', { userId: authSel, password: $('#aPw').value });
      session = { token: r.token, userId: r.userId }; store.set(K.session, session);
      prefs.lastUser = r.userId; savePrefs();
      state = blank(); queue = []; saveQueue();
      startApp();
    } catch (e) { drawLogin(e.message); }
  };
  const first = $(isNew ? '#aName' : '#aPw'); first && first.focus();
}
const AUTH = {
  connect() {
    const url = $('#apiUrl').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)) return showSetup('That does not look like an Apps Script web app URL. It should start with https://script.google.com/ and end in /exec.');
    cfg = { api: url }; store.set(K.cfg, cfg); authSel = null; showLogin();
  },
  demo() { cfg = { demo: true }; store.set(K.cfg, cfg); seedDemo(); session = { userId: 'u1' }; store.set(K.session, session); startApp(); },
  pick(el) { authSel = el.dataset.id; drawLogin(); },
  changeApi() { cfg = {}; store.set(K.cfg, cfg); showSetup(); }
};

function seedDemo() {
  state = blank();
  state.users = [{ id: 'u1', name: 'Alex', email: '', color: USER_COLORS.u1 }, { id: 'u2', name: 'Sam', email: '', color: USER_COLORS.u2 }];
  state.cards = [{ id: 'k1', owner: 'u1', name: 'Rewards Card', last4: '4417', statementDay: 12, dueDay: 1, limit: 150000, deleted: false }, { id: 'k2', owner: 'u2', name: 'Travel Card', last4: '8820', statementDay: 20, dueDay: 8, limit: 100000, deleted: false }];
  state.settings = { budgets: { _total: 60000, groceries: 12000, dining: 8000 } };
  const items = [['Big Basket', 'groceries', 1850], ['Dinner out', 'dining', 1420], ['Uber', 'transport', 310], ['Petrol', 'fuel', 2000], ['Electricity bill', 'utilities', 2340], ['Movie night', 'entertainment', 780], ['Pharmacy', 'health', 460], ['Coffee', 'dining', 280], ['Vegetables', 'groceries', 420], ['Amazon', 'shopping', 2199], ['Cat food', 'pets', 1150], ['Swiggy', 'dining', 540]];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const modes = ['upi', 'upi', 'upi', 'credit_card', 'credit_card', 'cash', 'debit_card'];
  for (let i = 0; i < 70; i++) {
    const it = items[Math.floor(rnd() * items.length)], paidBy = rnd() < .55 ? 'u1' : 'u2', mode = modes[Math.floor(rnd() * modes.length)];
    const amount = Math.round(it[2] * (.6 + rnd() * .9)), splitType = rnd() < .75 ? 'shared' : 'personal';
    state.expenses.push({ id: 'd' + i, type: 'expense', date: addDays(today(), -Math.floor(rnd() * 150)), amount, description: it[0], category: it[1], paidBy, mode, cardId: mode === 'credit_card' ? (paidBy === 'u1' ? 'k1' : 'k2') : '', splitType, ...computeShares(amount, paidBy, splitType, 50), notes: '', recurringId: '', createdAt: Date.now() - i * 1000, deleted: false });
  }
  const old = state.expenses.filter(e => monthOf(e.date) < monthOf(today()));
  if (old.length) { old.forEach(e => (e.settledBy = 'ds1')); state.expenses.push({ id: 'ds1', type: 'settlement', date: dayOn(...today().split('-').map(Number).slice(0, 2), 1), amount: 1840, description: 'Settlement', category: '', paidBy: 'u2', mode: 'upi', cardId: '', splitType: '', share1: 0, share2: 0, notes: '', recurringId: '', settledBy: '', createdAt: Date.now(), deleted: false }); }
  state.recurring = [{ id: 'r1', description: 'Rent', amount: 24000, category: 'rent', paidBy: 'u1', mode: 'netbanking', cardId: '', splitType: 'shared', payerPct: 50, dayOfMonth: 1, active: true, deleted: false }];
  saveState();
}

/* ───────────────────────── boot ───────────────────────── */
function route() {
  const v = location.hash.replace(/^#\/?/, '');
  ui.view = VIEWS[v] ? v : 'home';
  if (session) { closeSheet(); render(); window.scrollTo(0, 0); }
  if (v === 'add') { history.replaceState(null, '', location.pathname + '#/home'); if (session) openExpense(); }
}
function startApp() {
  route();
  if (cfg.demo) { runRecurring(); render(); notifyCards(); } else sync();
}
function boot() {
  if (location.hash.startsWith('#api=')) {
    const url = decodeURIComponent(location.hash.slice(5));
    if (/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url) && url !== cfg.api) { cfg = { api: url }; store.set(K.cfg, cfg); session = null; store.del(K.session); }
    history.replaceState(null, '', location.pathname);
  }
  if (session && (cfg.api || cfg.demo)) return startApp();
  session = null;
  if (cfg.api) return showLogin();
  showSetup();
}
window.addEventListener('hashchange', route);
window.addEventListener('online', () => { setStatus(); sync(); });
window.addEventListener('offline', setStatus);
document.addEventListener('visibilitychange', () => { if (!document.hidden && session && Date.now() - lastSync > 30000) sync(); });
window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); installEvt = ev; if (session && ui.view === 'more') render(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
})();
